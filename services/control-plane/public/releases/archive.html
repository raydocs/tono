<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>往期版本 · Tono</title>
  <meta name="description" content="Tono 已撤回的旧版本不再提供下载。源码仍可按提交检出。">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="站点">
      <a href="/">下载</a>
      <a href="/help">帮助</a>
      <a href="/status">运行状态</a>
      <a href="/archive" aria-current="page">往期版本</a>
    </nav>
    <header class="hero compact">
      <p class="eyebrow">ARCHIVE</p>
      <h1>往期版本不再提供下载</h1>
      <p class="lede">基准之前的安装包已经撤下。它们带着后来修好的问题：微信直连失效、断网保护解除后会自己重新打开、隧道已经不通却仍显示已连接。</p>
    </header>
    <section>
      <div class="section-heading">
        <p class="eyebrow">WHY</p>
        <h2>为什么不留旧包</h2>
      </div>
      <div class="prose">
        <p>留下旧安装包，等于暗示它们仍可选用。对已经修好的缺陷来说，这层暗示本身就是风险。</p>
        <p>源码没有丢。每个被撤下的构建都已合入主线，仍可按提交检出重建。删掉的只是「它还是一个选项」。</p>
        <p>当前仍提供的版本写在<a href="/">下载首页</a>。更细的改动摘要也在首页时间线里。</p>
      </div>
    </section>
    <footer>
      <p>需要回滚到某个提交时，按仓库历史检出，不要从本站找旧安装包。</p>
    </footer>
  </main>
</body>
</html>
