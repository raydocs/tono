# Drop-in for tono-exit-agent.timer: /etc/systemd/system/tono-exit-agent.timer.d/10-tono-cadence.conf
#
# Only the cadence is versioned here. The deployed service/timer fragments
# (user, ExecStart, sandbox, credentials) stay per-node; see TIMER_BOOT_DIAGNOSIS.md.
# A drop-in therefore changes the schedule without inventing that contract.
#
# OnUnitInactiveSec counts from the end of the previous run, so a slow round
# (Xray restart retry, control-plane timeout) can never stack a second run behind
# it, and the next round still starts 60 s later. Verified in production 2026-10-23.
# The empty assignment clears any inherited monotonic trigger of the same kind
# before setting the fleet value.
[Timer]
OnUnitInactiveSec=
OnUnitInactiveSec=60s
