# Tono API relay (decision 077): SNI pass-through to the Cloudflare edge.
# TLS is not terminated here. Only the listed server names are forwarded;
# anything else is sent to a closed port. Managed by the Tono ops session;
# the canonical copy is tooling/ops/relay/tono-relay.stream.conf in the repo.
map $ssl_preread_server_name $tono_relay_upstream {
    api.afk.ccwu.cc      tono_control_plane;
    releases.afk.ccwu.cc tono_control_plane;
    default              127.0.0.1:9;
}
# Log only sessions that named a relayed host; scanner noise stays out.
map $ssl_preread_server_name $tono_relay_log {
    api.afk.ccwu.cc      1;
    releases.afk.ccwu.cc 1;
    default              0;
}
upstream tono_control_plane {
    server 104.20.26.170:443;
    server 172.66.162.98:443 backup;
}
# At most 256 concurrent relay sessions from one address (carrier-grade NAT shares an
# address, so the cap is loose); excess sessions are closed before preread.
limit_conn_zone $binary_remote_addr zone=tono_relay_per_ip:1m;
log_format tono_relay '$time_iso8601 $remote_addr sni=$ssl_preread_server_name status=$status up=$upstream_addr in=$bytes_received out=$bytes_sent t=$session_time';
access_log /var/log/nginx/tono-relay.log tono_relay if=$tono_relay_log;
error_log /var/log/nginx/tono-relay-error.log warn;
server {
    listen 2053 reuseport;
    listen [::]:2053 reuseport;
    ssl_preread on;
    limit_conn tono_relay_per_ip 256;
    proxy_connect_timeout 5s;
    proxy_timeout 90s;
    proxy_pass $tono_relay_upstream;
}
