name: Windows candidate installer

on:
  workflow_call:
    inputs:
      update_release_sequence:
        description: Monotonic sequence for a paired unsigned native candidate
        required: true
        type: string
  workflow_dispatch:
  push:
    branches:
      - 'stability/desktop-0.0.72-20260908'
      # Ship-plan Encrypted DNS + connecting-pill candidate for G1.1.
      # Path filter: touching this file (or windows-core.yml) starts a candidate.
      # Rebuild 2026-09-11: Backup UDP column + catalog X-Tono-Accept: hy2.
      # Remove the extra branch after G1.1.
      - 'cursor/ship-plan-first-publish-d57f'
    paths:
      - .github/workflows/windows-candidate.yml
      - .github/workflows/windows-core.yml
      - tooling/scripts/prepare-windows-sing-box.sh

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-core:
    uses: ./.github/workflows/windows-core.yml
  # sing-box.exe is not in git (#1159). Rebuild the reviewed alpha.9 input from the
  # pinned source; the script refuses any bytes but the pinned digest.
  sing-box-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and verify fixed windows-amd64-v2 input
        run: sh tooling/scripts/prepare-windows-sing-box.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sing-box-windows-amd64-${{ github.sha }}
          path: apps/windows/app/src-tauri/sidecar/sing-box-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 14
  build:
    needs: [pinned-core, sing-box-input]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/windows/app
        shell: pwsh
    env:
      # Internal build channel (owner decision 2026-09-24): classified connect-failure
      # reports default on. Only this workflow sets it; windows-release.yml never does.
      TONO_BUILD_CHANNEL: internal
      TONO_UPDATE_RELEASE_SEQUENCE: ${{ inputs.update_release_sequence || '' }}
      TONO_UPDATER_PUBLIC_KEY: ${{ inputs.update_release_sequence != '' && vars.TONO_UPDATER_PUBLIC_KEY || '' }}
      VITE_TONO_UPDATES_CONFIGURED: ${{ inputs.update_release_sequence != '' && vars.TONO_UPDATER_PUBLIC_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.26.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/windows/app/pnpm-lock.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-core-${{ github.sha }}
          path: apps/windows/app/src-tauri/sidecar
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sing-box-windows-amd64-${{ github.sha }}
          path: apps/windows/app/src-tauri/sidecar
      - name: Install dependencies and check desktop versions
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile
          python ../../../tooling/scripts/verify-desktop-version.py --expected 0.0.75
      - name: Prepare the exact stable Mihomo and Windows resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The Service cannot be built safely until the exact core it will launch exists.
          # Skip only the Service-input check here; the full prebuild below performs it after
          # all three Service binaries have been compiled with this core's digest.
          pnpm prebuild -- x86_64-pc-windows-msvc --skip-windows-service

      - name: Build Tono Windows Service from the same commit
        shell: pwsh
        working-directory: apps/windows/service
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $core = (Resolve-Path '../app/src-tauri/sidecar/tono-core-x86_64-pc-windows-msvc.exe').Path
          $coreSha256 = (Get-FileHash -LiteralPath $core -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($coreSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid Mihomo SHA-256: $coreSha256"
          }
          $env:TONO_CORE_SHA256 = $coreSha256
          "TONO_CORE_SHA256=$coreSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force ../app/src-tauri/resources | Out-Null
          Set-Content -LiteralPath ../app/src-tauri/resources/core-sha256.txt -Value "$coreSha256" -Encoding ascii
          $singBox = (Resolve-Path '../app/src-tauri/sidecar/sing-box-x86_64-pc-windows-msvc.exe').Path
          $singBoxSha256 = (Get-FileHash -LiteralPath $singBox -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSingBox = 'b2e6902ee75d9c4af79df28a61ded67afc4283fc83a44dee8896f3737a4ed027'
          if ($singBoxSha256 -ne $expectedSingBox) {
            throw "sing-box sidecar $singBoxSha256 is not the pinned alpha.9 digest $expectedSingBox"
          }
          $env:TONO_SING_BOX_SHA256 = $singBoxSha256
          "TONO_SING_BOX_SHA256=$singBoxSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Set-Content -LiteralPath ../app/src-tauri/resources/sing-box-sha256.txt -Value "$singBoxSha256" -Encoding ascii
          cargo build --locked --release --features standalone,client --bins
          # resources/ is gitignored locally (built artifacts), so a fresh CI checkout lacks it.
          New-Item -ItemType Directory -Force ../app/src-tauri/resources | Out-Null
          Copy-Item target/release/tono-service.exe ../app/src-tauri/resources/tono-service.exe -Force
          Copy-Item target/release/tono-service-install.exe ../app/src-tauri/resources/tono-service-install.exe -Force
          Copy-Item target/release/tono-service-uninstall.exe ../app/src-tauri/resources/tono-service-uninstall.exe -Force
          # Both the daemon that authorizes a launch and the privileged replacement helper must
          # carry the exact digest. Without it the package installs successfully but every connect
          # fails closed at startingKillSwitch, which is what made 0.0.30 unusable.
          foreach ($binary in @(
            '../app/src-tauri/resources/tono-service.exe',
            '../app/src-tauri/resources/tono-service-install.exe'
          )) {
            $binaryPath = (Resolve-Path $binary).Path
            $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($binaryPath))
            if (-not $ascii.Contains($coreSha256)) {
              throw "The built $(Split-Path -Leaf $binary) does not contain the Mihomo SHA-256 pin."
            }
            if (-not $ascii.Contains($singBoxSha256)) {
              throw "The built $(Split-Path -Leaf $binary) does not contain the pinned sing-box SHA-256."
            }
          }

      - name: Prepare and validate the Windows payload inputs
        run: |
          # PowerShell normally continues after a native executable returns nonzero. Without
          # these preferences the release preflight can fail, then a later passing test makes
          # the whole step green and allows an unchecked installer to be uploaded.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm prebuild -- x86_64-pc-windows-msvc
          pnpm release:preflight --config-only
          pnpm typecheck
          pnpm exec vitest run tests/update.test.ts
          pnpm test:dev-control

      - name: Build candidate only (no updater signature or release publication)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm tauri build --bundles nsis
      - name: Inspect installer payload and record provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)" }
          $installer = $installers[0]
          pnpm release:preflight --payload-only $installer.FullName
          $version = node -p "require('./package.json').version"
          $files = @($installer.FullName) + @(Get-ChildItem src-tauri/resources/tono-service*.exe | ForEach-Object FullName)
          $files += (Resolve-Path src-tauri/sidecar/tono-core-x86_64-pc-windows-msvc.exe).Path
          $files += (Resolve-Path src-tauri/sidecar/sing-box-x86_64-pc-windows-msvc.exe).Path
          $hashes = @($files | ForEach-Object { @{ name = (Split-Path -Leaf $_); sha256 = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant() } })
          @{ version = $version; source = $env:GITHUB_SHA; candidateOnly = $true; releaseAccepted = $false; updaterSigned = $false; authenticodeSigned = $false; files = $hashes } | ConvertTo-Json -Depth 5 | Set-Content target/release/bundle/nsis/candidate-manifest.json

      - name: Measure paired unsigned update target from the actual NSIS payload
        if: inputs.update_release_sequence != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS package' }
          $extracted = Join-Path $env:RUNNER_TEMP 'paired-windows-payload'
          7z x -y "-o$extracted" $installer[0].FullName
          # Same selector as desktop-update-sign.yml: the package also carries a $PLUGINSDIR gate
          # copy of every resource, and the Service compares sing-box.exe as a fourth component.
          $components = @{}
          foreach ($line in @(node ../../../tooling/scripts/windows-package-components.mjs $extracted)) {
            $name, $value = $line -split '=', 2
            $components[$name] = $value
          }
          foreach ($name in @('WINDOWS_APP', 'WINDOWS_CORE', 'WINDOWS_SERVICE', 'WINDOWS_SING_BOX')) {
            if (-not $components[$name]) { throw "The component selector did not return $name" }
          }
          $version = node -p "require('./package.json').version"
          $measureArgs = @(
            '--version', $version, '--source', $env:GITHUB_SHA, '--sequence', $env:TONO_UPDATE_RELEASE_SEQUENCE,
            '--artifact', $installer[0].FullName,
            '--app', $components['WINDOWS_APP'], '--core', $components['WINDOWS_CORE'],
            '--privileged', $components['WINDOWS_SERVICE'],
            '--sing-box', $components['WINDOWS_SING_BOX'],
            '--output', 'target/release/bundle/nsis/update-target.windows-x86_64.json'
          )
          node ../../../tooling/scripts/desktop-update-v1.mjs measure --target windows-x86_64 @measureArgs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tono-windows-0.0.75-candidate-${{ github.sha }}
          path: |
            apps/windows/app/target/release/bundle/nsis/*-setup.exe
            apps/windows/app/target/release/bundle/nsis/candidate-manifest.json
            apps/windows/app/target/release/bundle/nsis/update-target.windows-x86_64.json
          if-no-files-found: error
          retention-days: 7

  # Build provenance for the candidate installer this run uploaded (decision 079
  # D8-A: generated and auditable with `gh attestation verify`; clients do not
  # check it). The only job holding an OIDC token or attestation write; it checks
  # out and runs no repository code and sees no secret. A failed attestation fails
  # the run. desktop-update-candidate.yml grants these permissions to its call.
  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tono-windows-0.0.75-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/attest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/*-setup.exe
