name: Screenshots nightly

# Owner decision D9-A (docs/ops/amp-backlog-2026-10-10.md §7): screenshot and
# window-capture tests are not part of the pull-request gate (ci-gate). They
# run here once a night on main, and on demand.
#
# - macOS: the four MacSeaPolishRenderTests methods gated on
#   TONO_HOSTED_WINDOW_DIAGNOSTIC (whole-window captures through
#   ScreenCaptureKit) plus the Chinese whole-window pass. macos-ci.yml skips
#   exactly these four; tooling/scripts/tests/screenshot-nightly-split.test.mjs
#   holds the two lists equal. MacUsabilityRenderTests stay in the PR gate:
#   they assert native labels, identifiers and opacity, not pixels.
#   macos-release.yml still runs the whole target, these captures included.
# - Ops console: Playwright pixel comparisons (`toHaveScreenshot`). The PR gate
#   runs the same specs with --ignore-snapshots on Linux, in four shards; the
#   baselines were captured on macOS at DPR 2, so they are compared here on
#   macOS in the same four shards (no --ignore-snapshots). One serial
#   `npx playwright test` was the whole nightly's wall clock.
# - Windows: the PR gate has no screenshot test, so nothing moved.
#
# A failure is a red run in the Actions tab, and a scheduled or dispatched run
# on main opens (or comments on) one tracking issue so it is not missed.
#
# Re-recording: dispatch with update_baselines=true on the branch whose console
# changed. Only ops-console-rerecord runs; it re-records the Playwright baselines
# on this same macos-26 image and uploads e2e/__screenshots__ as the artifact
# ops-console-baselines-<sha> to commit after a visual check. The scheduled run
# never re-records. Re-recording stays one job so the artifact is one tree.

on:
  schedule:
    - cron: '23 18 * * *' # 02:23 Asia/Shanghai
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Re-record the ops-console Playwright baselines instead of comparing them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screenshots-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sing-box-input:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and verify fixed darwin-arm64 input
        run: sh tooling/scripts/prepare-macos-sing-box.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sing-box-darwin-arm64-nightly
          path: apps/macos/Tono/Resources/sing-box
          if-no-files-found: error
          retention-days: 3

  macos-window-captures:
    needs: sing-box-input
    if: ${{ !inputs.update_baselines }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sing-box-darwin-arm64-nightly
          path: apps/macos/Tono/Resources
      - name: Verify core and build current helper
        run: |
          chmod +x apps/macos/Tono/Resources/sing-box
          sh tooling/scripts/verify-macos-sing-box.sh
          tooling/scripts/build-core-helper.sh

      - name: Whole-window Mac polish captures (English)
        env:
          TEST_RUNNER_TONO_HOSTED_WINDOW_DIAGNOSTIC: "1"
        run: |
          xcodebuild \
            -project apps/macos/Tono.xcodeproj \
            -scheme Tono \
            -configuration Debug \
            -only-testing:TonoTests/MacSeaPolishRenderTests/testWholeWindowStatesAndAccessibility \
            -only-testing:TonoTests/MacSeaPolishRenderTests/testFullTransitionsWaterAndProcessCPU \
            -only-testing:TonoTests/MacSeaPolishRenderTests/testSharedControlSurfacesAndAccessibilityVariants \
            -only-testing:TonoTests/MacSeaPolishRenderTests/testNativeResizeCoverageBeforeAndAfterCachedTreeRebuild \
            -resultBundlePath apps/macos/test-results/TonoTests-polish.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            test

      - name: Whole-window Mac polish captures (Chinese)
        env:
          TEST_RUNNER_TONO_HOSTED_WINDOW_DIAGNOSTIC: "1"
        run: |
          xcodebuild \
            -project apps/macos/Tono.xcodeproj \
            -scheme Tono \
            -configuration Debug \
            -testLanguage zh-Hans -testRegion CN \
            -only-testing:TonoTests/MacSeaPolishRenderTests/testWholeWindowStatesAndAccessibility \
            -resultBundlePath apps/macos/test-results/TonoTests-zh.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            test

      - name: Preserve captures and result bundles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tono-macos-window-captures-${{ github.sha }}
          path: |
            apps/macos/test-results/TonoTests-polish.xcresult
            apps/macos/test-results/TonoTests-zh.xcresult
            apps/macos/test-results/renders/*.png
            apps/macos/test-results/renders/*.txt
          if-no-files-found: warn
          retention-days: 7

  ops-console-screenshots:
    if: ${{ !inputs.update_baselines }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: services/ops-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install chromium

      - name: Screenshot baselines compared
        # The same specs and the same four-way split as the PR gate, without
        # --ignore-snapshots, so every toHaveScreenshot assertion compares
        # against e2e/__screenshots__.
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Preserve diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ops-console-screenshot-diffs-${{ github.sha }}-${{ matrix.shard }}
          path: services/ops-console/test-results
          if-no-files-found: warn
          retention-days: 7

  ops-console-rerecord:
    if: ${{ inputs.update_baselines }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/ops-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install chromium

      - name: Screenshot baselines re-recorded
        if: ${{ inputs.update_baselines }}
        # Re-records only the baselines that differ, and adds missing ones.
        # 账目 ›「一个月的账，一页」(light) has hung here in Playwright's font
        # wait while the compare run captured it stably (#1588); if it fails,
        # take its baseline from a compare run's ledger-actual.png.
        run: npx playwright test --update-snapshots=changed

      - name: Upload re-recorded baselines
        if: ${{ always() && inputs.update_baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ops-console-baselines-${{ github.sha }}
          path: services/ops-console/e2e/__screenshots__
          if-no-files-found: error
          retention-days: 7

  report-failure:
    needs: [sing-box-input, macos-window-captures, ops-console-screenshots, ops-console-rerecord]
    if: failure() && github.ref == 'refs/heads/main' && !inputs.update_baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Screenshots nightly is failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run ${run} (${context.eventName}, \`${context.sha}\`) failed. ` +
              'Diffs and captures are in that run\'s artifacts. Close this issue when the nightly is green again.';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]',
            });
            const open = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
