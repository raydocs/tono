name: Promote Windows update channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable Windows Release SemVer to promote
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-update-channel
  cancel-in-progress: false

jobs:
  # A job-level `if:` on the branch is a guard that cannot fail. GitHub records a
  # skipped job as a success, so dispatching this workflow from the wrong ref
  # produced a green run that did nothing — which is precisely how this
  # workflow's own guard and its environment's branch policy disagreed for days
  # without anyone noticing, and why the step that reaches users could not
  # succeed at all. This job carries no condition, so a wrong ref goes red, and
  # `needs:` keeps the real job from starting or requesting its environment
  # approval.
  branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a ref that is not the release line
        env:
          EXPECTED: refs/heads/release/windows
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::Promoting the Windows update channel must run from $EXPECTED, but this run is on $GITHUB_REF. Nothing was done."
            exit 1
          fi
          echo "running from $GITHUB_REF"

  promote:
    needs: branch
    environment: windows-update-channel
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      TONO_UPDATER_PUBLIC_KEY: ${{ vars.TONO_UPDATER_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Require a published stable Windows Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = false
          # Immutability only applies to releases published after the repo setting was
          # enabled; v0.0.24 predates it. Warn instead of blocking the channel.
          if [ "$(jq -r .immutable <<<"$release")" != true ]; then
            echo "::warning::v${RELEASE_VERSION} is not an immutable release (published before the repo setting was enabled)"
          fi
          test "$(jq -r .tag_name <<<"$release")" = "v${RELEASE_VERSION}"
          printf '%s' "$release" > "$RUNNER_TEMP/windows-release.json"
          mkdir -p "$RUNNER_TEMP/windows-channel-candidate"
          gh release download "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/windows-channel-candidate"

      # The artefact must already be in the bucket: the validator below downloads
      # from there and checks the signature over exactly what an updater will
      # fetch, so a forgotten upload fails this run instead of pointing every
      # updater at a 404. Upload with:
      #   node tooling/scripts/upload-release-asset.mjs --tag v<version>
      - name: Verify every channel artifact with the configured updater public key
        run: |
          node apps/windows/app/scripts/validate-windows-channel.mjs \
            "$RUNNER_TEMP/windows-channel-candidate/latest.json" \
            "$RUNNER_TEMP/windows-release.json" \
            "$RELEASE_VERSION" \
            "$RUNNER_TEMP/windows-latest.json"

      - name: Atomically advance the audited Windows channel branch
        run: |
          set -euo pipefail
          if git fetch origin refs/heads/windows-updates:refs/remotes/origin/windows-updates; then
            git switch --detach refs/remotes/origin/windows-updates
          else
            git switch --orphan windows-updates
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP/windows-latest.json" latest.json
          git add latest.json
          if git diff --cached --quiet; then
            echo "Windows channel already points to v${RELEASE_VERSION}"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "release(windows): promote v${RELEASE_VERSION}"
          # A fast-forward ref update is the only publication point. Validation, download,
          # commit, or push failure leaves the previous branch tip and latest.json untouched.
          git push origin HEAD:refs/heads/windows-updates

      # The channel and the download page answer the same question — what should a
      # customer install — and only one of them used to move. The page named the
      # build before this one for as long as anybody remembered to edit it.
      - name: Follow the channel on the download page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git switch --force main
          git pull --ff-only origin main
          # Two populations ask two different places for the same answer: builds
          # before 0.0.33 ask the orphan branch, later ones ask the control
          # plane. Both are advanced here, in one commit, so neither can lag.
          cp "$RUNNER_TEMP/windows-latest.json" services/control-plane/public/windows/latest.json
          node tooling/scripts/generate-release-center.mjs
          if git diff --quiet -- services/control-plane/public; then
            echo "the download page already offers v${RELEASE_VERSION}"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/control-plane/public
          git commit -m "release(center): serve v${RELEASE_VERSION} from the control plane too"
          git push origin HEAD:refs/heads/main
          # Committing is not publishing: the page is a static asset of the Worker
          # and reaches nobody until the control plane is deployed from main.
          echo "::notice::The download page now offers v${RELEASE_VERSION} on main. Deploy the control plane to publish it."
