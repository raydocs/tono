name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact App SemVer already committed in package.json and Tauri/Cargo config
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # A job-level `if:` on the branch is a guard that cannot fail. GitHub records a
  # skipped job as a success, so dispatching this workflow from the wrong ref
  # produced a green run that did nothing — which is precisely how this
  # workflow's own guard and its environment's branch policy disagreed for days
  # without anyone noticing, and why the step that reaches users could not
  # succeed at all. This job carries no condition, so a wrong ref goes red, and
  # `needs:` keeps the real job from starting or requesting its environment
  # approval.
  branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a ref that is not the release line
        env:
          EXPECTED: refs/heads/release/windows
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::Building a Windows release must run from $EXPECTED, but this run is on $GITHUB_REF. Nothing was done."
            exit 1
          fi
          echo "running from $GITHUB_REF"

  build-draft:
    needs: branch
    environment: windows-release
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/windows/app
    env:
      TONO_UPDATER_PUBLIC_KEY: ${{ vars.TONO_UPDATER_PUBLIC_KEY }}
      VITE_TONO_UPDATES_CONFIGURED: 'true'
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.3.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/windows/app/pnpm-lock.yaml

      - name: Verify release version and updater signing configuration
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Requested Windows stable version is not a release SemVer: $env:RELEASE_VERSION"
          }
          $packageVersion = node -p "require('./package.json').version"
          $tauriVersion = node -p "require('./src-tauri/tauri.conf.json').version"
          $metadata = cargo metadata --locked --no-deps --manifest-path src-tauri/Cargo.toml --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($metadata.packages | Where-Object { $_.name -eq 'tono-windows' }).version
          foreach ($actual in @($packageVersion, $tauriVersion, $cargoVersion)) {
            if ($actual -ne $env:RELEASE_VERSION) {
              throw "Requested version $env:RELEASE_VERSION does not match App version $actual"
            }
          }
          pnpm release:updater-config

      # Mirrors the macOS discipline: Sparkle refuses to build without
      # apps/macos/release-notes/build<N>.md, because the text a user reads before accepting
      # an update must be reviewed in git, not typed into a signed feed by hand. Windows had
      # no equivalent, so tauri-action's placeholder `releaseBody` became the `notes` field
      # of latest.json, and the update dialog rendered an operator instruction at every user.
      - name: Require committed release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notesPath = Join-Path $env:GITHUB_WORKSPACE "apps/windows/release-notes/$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            Write-Output "::error title=Release notes are missing::$notesPath"
            throw "apps/windows/release-notes/$env:RELEASE_VERSION.md does not exist. Update notes are shown to every user in the update dialog and must be reviewed in git."
          }
          # Null-check before Trim(): Get-Content -Raw on an empty file returns $null, and
          # $null.Trim() under ErrorActionPreference=Stop throws something unrelated to the
          # actual problem.
          $notes = Get-Content -LiteralPath $notesPath -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "apps/windows/release-notes/$env:RELEASE_VERSION.md is empty"
          }
          $notes = $notes.Trim()
          # A heredoc delimiter appearing inside the payload would let the notes file write
          # arbitrary further variables into the job environment.
          $delimiter = 'TONO_RELEASE_NOTES_EOF'
          if ($notes -match [regex]::Escape($delimiter)) {
            throw "release notes must not contain the literal $delimiter"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "RELEASE_NOTES<<$delimiter"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value $notes
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value $delimiter

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing key pair
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Tauri updater signing private key and password must both be configured'
          }
          $payload = Join-Path $env:RUNNER_TEMP 'tono-updater-key-check'
          Set-Content -NoNewline -Path $payload -Value 'Tono updater signing key check'
          pnpm tauri signer sign $payload
          node scripts/prepare-updater-config.mjs --verify $payload "$payload.sig"
          Remove-Item -Force $payload, "$payload.sig"

      - name: Prepare the exact stable Mihomo and Windows resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The Service cannot be built safely until the exact core it will launch exists.
          # Skip only the Service-input check here; the full prebuild below performs it after
          # all three Service binaries have been compiled with this core's digest.
          pnpm prebuild -- x86_64-pc-windows-msvc --skip-windows-service

      - name: Build Tono Windows Service from the same commit
        shell: pwsh
        working-directory: apps/windows/service
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $core = (Resolve-Path '../app/src-tauri/sidecar/tono-core-x86_64-pc-windows-msvc.exe').Path
          $coreSha256 = (Get-FileHash -LiteralPath $core -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($coreSha256 -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid Mihomo SHA-256: $coreSha256"
          }
          $env:TONO_CORE_SHA256 = $coreSha256
          "TONO_CORE_SHA256=$coreSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force ../app/src-tauri/resources | Out-Null
          Set-Content -LiteralPath ../app/src-tauri/resources/core-sha256.txt -Value "$coreSha256" -Encoding ascii
          cargo build --locked --release --features standalone,client --bins
          # resources/ is gitignored locally (built artifacts), so a fresh CI checkout lacks it.
          New-Item -ItemType Directory -Force ../app/src-tauri/resources | Out-Null
          Copy-Item target/release/tono-service.exe ../app/src-tauri/resources/tono-service.exe -Force
          Copy-Item target/release/tono-service-install.exe ../app/src-tauri/resources/tono-service-install.exe -Force
          Copy-Item target/release/tono-service-uninstall.exe ../app/src-tauri/resources/tono-service-uninstall.exe -Force
          # Both the daemon that authorizes a launch and the privileged replacement helper must
          # carry the exact digest. Without it the package installs successfully but every connect
          # fails closed at startingKillSwitch, which is what made 0.0.30 unusable.
          foreach ($binary in @(
            '../app/src-tauri/resources/tono-service.exe',
            '../app/src-tauri/resources/tono-service-install.exe'
          )) {
            $binaryPath = (Resolve-Path $binary).Path
            $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($binaryPath))
            if (-not $ascii.Contains($coreSha256)) {
              throw "The built $(Split-Path -Leaf $binary) does not contain the Mihomo SHA-256 pin."
            }
          }

      - name: Prepare and validate the Windows payload inputs
        run: |
          # PowerShell normally continues after a native executable returns nonzero. Without
          # these preferences the release preflight can fail, then a later passing test makes
          # the whole step green and allows an unchecked installer to be uploaded.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm prebuild -- x86_64-pc-windows-msvc
          pnpm release:preflight --config-only
          pnpm typecheck
          pnpm exec vitest run tests/update.test.ts
          pnpm test:dev-control

      - name: Build signed updater artifacts and create a draft GitHub Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TONO_UPDATER_PUBLIC_KEY: ${{ vars.TONO_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TONO_UPDATES_CONFIGURED: 'true'
        with:
          projectPath: apps/windows/app
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.updater.conf.json
          tagName: v__VERSION__
          releaseName: Tono Windows v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false

      - name: Inspect the built NSIS payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installers = @(
            Get-ChildItem -LiteralPath 'target/release/bundle/nsis' `
              -Filter '*-setup.exe' -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, found $($installers.Count)"
          }
          pnpm release:preflight --payload-only $installers[0].FullName

      # The draft this job creates reaches no user until the channel is advanced. That used to
      # be said in the release body, where users read it and operators did not; it belongs in
      # the run summary instead.
      - name: Say what still has to happen
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            "## Tono Windows v$env:RELEASE_VERSION",
            "",
            "A **draft** GitHub Release was created. No user can reach it yet.",
            "",
            "1. Review and **publish** the draft release.",
            "2. Run **Promote Windows update channel** for exactly ``$env:RELEASE_VERSION``.",
            "",
            "Until step 2 completes, ``windows-updates/latest.json`` keeps offering the previously promoted version to every installed client."
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value ($lines -join "`n")
