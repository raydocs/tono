name: Windows CI

# `windows-release.yml` builds the service but never tests it, so nothing ran
# these on a change: 157 unit tests in `tono-core` and ten integration tests
# covering the service's lifecycle — start, stop, permissions, ownership, kill
# switch release. Having them and not running them is how the macOS side spent a
# day rediscovering faults its own suite could have caught.
#
# Two jobs on purpose. `tono-core` is platform-independent and passes on any
# runner, so a failure there is a real regression. The service's integration tests
# touch Windows service control and may need privileges a runner does not grant;
# keeping them separate means such a failure is diagnosable instead of turning the
# whole of Windows CI red for a reason nobody can locate.

on:
  # Manual re-run, so a flake or an infrastructure hiccup does not need a
  # pointless commit to retry.
  workflow_dispatch:
  pull_request:
    paths:
      - apps/windows/Cargo.toml
      - apps/windows/Cargo.lock
      - apps/windows/vendor/**
      - apps/windows/crates/**
      - apps/windows/service/**
      - apps/windows/app/**
      - .github/workflows/windows-ci.yml
      - .github/workflows/windows-candidate.yml
      - .github/workflows/windows-installer-smoke.yml
      - .github/workflows/desktop-update-candidate.yml
      - tooling/scripts/desktop-update-v1.mjs
      - tooling/scripts/tests/desktop-update-v1.test.mjs
      - tooling/scripts/test-windows-candidate-install.ps1
      - tooling/scripts/tests/windows-ci-paths.test.cjs
      - tooling/scripts/test-windows-qa.ps1
      - tooling/scripts/tests/windows-qa-guards.Tests.ps1
      - tooling/scripts/tests/fixtures/update-protocol-v1/**
      - apps/macos/Tono/Models/UpdateContractV1.swift
      - apps/macos/TonoTests/UpdateContractV1Tests.swift
  # Every branch, not just the default one. This repository is a fork, and no
  # `pull_request` event has ever produced a run here — PR #1 merged without one.
  # Restricted to `main` and paired with a trigger that does not fire, this
  # workflow could only ever have run after a merge, which is the wrong time to
  # learn something is broken. It is also why `macos-ci.yml` existed for days and
  # never executed once.
  push:
    paths:
      - apps/windows/Cargo.toml
      - apps/windows/Cargo.lock
      - apps/windows/vendor/**
      - apps/windows/crates/**
      - apps/windows/service/**
      - apps/windows/app/**
      - .github/workflows/windows-ci.yml
      - .github/workflows/windows-candidate.yml
      - .github/workflows/windows-installer-smoke.yml
      - .github/workflows/desktop-update-candidate.yml
      - tooling/scripts/desktop-update-v1.mjs
      - tooling/scripts/tests/desktop-update-v1.test.mjs
      - tooling/scripts/test-windows-candidate-install.ps1
      - tooling/scripts/tests/windows-ci-paths.test.cjs
      - tooling/scripts/test-windows-qa.ps1
      - tooling/scripts/tests/windows-qa-guards.Tests.ps1
      - tooling/scripts/tests/fixtures/update-protocol-v1/**
      - apps/macos/Tono/Models/UpdateContractV1.swift
      - apps/macos/TonoTests/UpdateContractV1Tests.swift

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Platform-independent, and verified passing outside Windows: 157 tests over
    # config, catalog, connection, auth, node, policy, and credentials. Running it
    # on Linux keeps the cheap half of the coverage fast and unconditional.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify desktop product versions agree
        run: |
          python3 tooling/scripts/tests/test_desktop_version.py
          python3 tooling/scripts/verify-desktop-version.py

      - name: Test tono-core
        # Run from the workspace root: the lockfile lives there, so `--locked`
        # from the crate directory would look for one that does not exist.
        working-directory: apps/windows
        run: cargo test --locked -p tono-core

  app:
    # 17 test files, 110 tests, a typecheck, and nothing ran any of them: the
    # release workflow runs one subset of them and only from a tag, which is after
    # the point where a failure is cheap. Verified locally before being made a
    # gate — 110 passing, typecheck clean.
    #
    # On Linux because the frontend does not need Windows to be type-checked or
    # unit-tested, and the Windows runner is the slow one.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/windows/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install pnpm as the project pins it
        run: npm install --global pnpm@11.3.0

      - name: Install exactly what the lockfile pins
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Verify Windows CI trigger coverage
        working-directory: apps/windows/app
        run: node --test ../../../tooling/scripts/tests/windows-ci-paths.test.cjs

      - name: Verify paired manifest signatures and artifact binding
        run: node --test ../../../tooling/scripts/tests/desktop-update-v1.test.mjs

      - name: Test
        run: pnpm test

      - name: Packaging and pinned Core identity contracts
        run: pnpm test:dev-control

  app-rust:
    # The `app` job above type-checks and unit-tests the frontend. Nothing ran
    # the Tauri crate's own 357 Rust tests — not this workflow, not the release
    # one — so two of them had been failing unnoticed. On Windows because that is
    # what ships, and because `build.rs` gives every test harness its own Common
    # Controls activation context there; the tests die at load time without it.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install pnpm as the project pins it
        run: npm install --global pnpm@11.3.0

      - name: Install exactly what the lockfile pins
        working-directory: apps/windows/app
        run: pnpm install --frozen-lockfile

      # `tauri.conf.json` points `frontendDist` at `../dist`, and `tauri-build`
      # refuses to run without it. Building the web assets is the cheapest way to
      # satisfy that; it is the same command the release uses.
      - name: Build the web assets the Tauri crate is configured against
        working-directory: apps/windows/app
        run: pnpm run web:build

      # `tauri-build` resolves `externalBin` and `resources` while compiling and
      # refuses when a declared path is missing. Both directories are gitignored
      # — they hold release artefacts measured in tens of megabytes — so a
      # checkout never has them. These are unit tests: nothing here executes the
      # core, the service binaries or the GeoIP data, and no test reads their
      # contents. Empty placeholders satisfy the resolver without pulling a
      # release down.
      - name: Placeholder the release-only artefacts the build script resolves
        working-directory: apps/windows/app/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sidecar, resources | Out-Null
          $paths = @(
            'sidecar/tono-core-x86_64-pc-windows-msvc.exe',
            'resources/Country.mmdb',
            'resources/geoip.dat',
            'resources/geosite.dat',
            'resources/tono-service.exe',
            'resources/tono-service-install.exe',
            'resources/tono-service-uninstall.exe',
            'resources/core-sha256.txt',
            'resources/core-identity.json'
          )
          foreach ($p in $paths) {
            if (-not (Test-Path $p)) { New-Item -ItemType File -Force -Path $p | Out-Null }
          }

      - name: Test the Tauri crate
        working-directory: apps/windows/app/src-tauri
        run: cargo test --locked

      # The consumer does not execute tono-core's unit tests. G3 phase replay,
      # persistence refusal and re-entry must run on Windows, not only Ubuntu.
      - name: Test update journal phase and persistence recovery on Windows
        working-directory: apps/windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = 'update_journal::tests::'
          $listed = cargo test --locked -p tono-core --lib $filter -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate journal regressions' }
          foreach ($name in @(
            'only_verified_commit_can_remove_journal',
            'owner_replay_advances_in_order_and_crash_at_each_phase_never_commits',
            'first_launch_reentry_preserves_durable_recovery_progress'
          )) {
            if (-not ($listed -match "^$([regex]::Escape($filter + $name)): test$")) {
              throw "Expected journal regression is missing: $name"
            }
          }
          cargo test --locked -p tono-core --lib $filter -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Journal phase/persistence regressions failed' }

      # Cargo does not execute dependency integration tests with the Tauri suite.
      - name: Test update journal atomic writes on Windows
        working-directory: apps/windows
        run: cargo test --locked -p tono-core --test update_journal_atomic

      - name: Test shared desktop update contract on Windows
        working-directory: apps/windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'shared_wire_and_ownership_contract'
          $listed = cargo test --locked -p tono-core --test update_contract -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate shared update contract' }
          if (-not ($listed -match "^${test}: test$")) { throw 'Shared update contract test is missing' }
          cargo test --locked -p tono-core --test update_contract $test -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Shared update contract failed' }

  service:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate fault targeting without stopping real processes
        shell: pwsh
        run: ./tooling/scripts/tests/windows-qa-guards.Tests.ps1

      - name: Build the service the way the release does
        working-directory: apps/windows/service
        run: cargo build --locked --features standalone,client --bins

      - name: Test the service lifecycle
        working-directory: apps/windows/service
        # The suite is gated behind these features; without them the files compile
        # to nothing and the job would pass having tested nothing at all.
        run: cargo test --locked --features standalone,client,test

      # The lifecycle `test` feature replaces the native DNS engine. Compile and
      # exercise its production orchestration with injected API/readback boundaries,
      # not a host-network mutation or an unfiltered no-test-feature suite.
      - name: Test native DNS apply orchestration
        working-directory: apps/windows/service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $filter = 'core::dns::engine::native_apply::tests::'
          $listed = cargo test --locked --features standalone,client --lib $filter -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate native DNS apply tests' }
          if (-not ($listed -match "^$([regex]::Escape($filter)).*: test$")) {
            throw 'Native DNS apply tests are missing'
          }
          cargo test --locked --features standalone,client --lib $filter -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native DNS apply tests failed' }

      - name: Test native update admission and independent executor
        working-directory: apps/windows/service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($filter in @('update_transaction::tests::update_', 'core::update::tests::update_')) {
            $listed = cargo test --locked --features standalone,client --lib $filter -- --list
            if ($LASTEXITCODE -ne 0) { throw "Could not enumerate $filter" }
            if (-not ($listed -match "^$([regex]::Escape($filter)).*: test$")) {
              throw "Native update tests are missing: $filter"
            }
            cargo test --locked --features standalone,client --lib $filter -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Native update tests failed: $filter" }
          }
          $filter = 'update_executor::tests::update_'
          $listed = cargo test --locked --features standalone,client --bin tono-service-install $filter -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate independent executor tests' }
          if (-not ($listed -match "^$([regex]::Escape($filter)).*: test$")) {
            throw 'Independent executor tests are missing'
          }
          cargo test --locked --features standalone,client --bin tono-service-install $filter -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Independent executor tests failed' }

      # `mod wfp` is `not(feature = "test")`, so the lifecycle suite compiles it out.
      # The targeted updater tests do not execute this module either. This is the part
      # of the kill switch no model can stand in for: whether the
      # kernel accepts the filter shapes the service builds. This runner is Windows and
      # administrator, so it can answer.
      #
      # Scoped to that module on purpose. Running the whole suite without the `test` feature
      # would take stubs off code that talks to the SCM and the network, which is not what
      # this step is for.
      - name: Ask the real filtering engine
        working-directory: apps/windows/service
        env:
          TONO_REQUIRE_REAL_WFP: '1'
        # `--lib` because `tests/common.rs` reaches for helpers that only exist under the
        # `test` feature and is compiled whatever the integration files' own `cfg` says, so
        # the crate does not build its integration targets in this configuration at all.
        # Verified locally before pushing rather than by watching this step fail.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'core::wfp::real_engine_tests::the_kernel_accepts_a_filter_with_many_same_field_conditions'
          $listed = cargo test --locked --features standalone,client --lib $test -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate real WFP tests' }
          if (-not ($listed -match "^$([regex]::Escape($test)): test$")) {
            throw 'Expected real WFP test is missing; zero executed tests is not qualification'
          }
          cargo test --locked --features standalone,client --lib $test -- --exact --nocapture
