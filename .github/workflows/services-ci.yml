name: Services CI

# The control plane serves api.afk.ccwu.cc, and until this existed nothing ran its
# 62 tests on a change. They were run by hand before a deploy, which is the same
# arrangement that let a stale release feed and an assertion pinned to a build
# number sit unnoticed — one of them was only found by deploying.
#
# The two service-side agents decide what accounts exist on an exit and what they
# are billed, so their arithmetic runs here too.
#
# The ops-contract job also holds the fixture generator to a byte-for-byte copy of
# the committed JSON, and runs every tooling/scripts/tests/*.test.mjs so a new
# script test is not a change that CI never sees. Catalog publisher / hy2 source
# writer tests are Ruby and run in the same job.
#
# Migrations are applied to an empty local D1 and then applied again: a file that
# cannot run from scratch, or that is not idempotent, is a restore that will not
# boot. Prefixes from 0039 must be unique because 0016/0017/0018 already taught
# us what a colliding number costs.
#
# Playwright shards run the ops-console specs for behaviour, not pixels: the
# screenshot baselines were captured on macOS and Linux fonts would fail them.
# The pixel comparisons run after merge in screenshots-nightly.yml on macOS
# (D9-A); --ignore-snapshots below must stay, or they return to the PR gate.
#
# After a green console build, a markdown size table is posted on the PR so a
# ratchet that is still under budget is visible before it is not.

on:
  workflow_call:
  # Manual re-run, so a flake or an infrastructure hiccup does not need a
  # pointless commit to retry. pull_request and merge_group enter through
  # ci-gate.yml so a PR does not start this workflow twice.
  workflow_dispatch:
  # Direct pushes on main and the release lines. A pull-request branch is
  # already covered by ci-gate; keeping push on that branch runs these jobs
  # twice, because the push ref and the pull_request ref do not share a
  # concurrency group.
  push:
    branches:
      - main
      - release/macos
      - release/windows
    paths:
      - services/**
      - ops-panel/**
      - tooling/scripts/remote/**
      # The relay nodes' end-to-end probe script and its test.
      - tooling/ops/relay/**
      # Post-install validator for the relay probe, relay logrotate and node agent.
      - tooling/ops/node-install/**
      - tooling/scripts/provision-tono-node.py
      - tooling/scripts/tests/test_provision_tono_node.py
      # The download-page check and its tests live here. Without these two the
      # generator could be changed without ever running the job that guards it.
      - tooling/scripts/generate-release-center.mjs
      - tooling/scripts/tests/generate-release-center.test.mjs
      # The migration-number checker and the *.test.mjs glob live outside
      # services/**; without these the new steps could be edited without running.
      - tooling/scripts/check-migration-numbers.mjs
      # Local migration rehearsal: its additive checker is tested by the glob below.
      - tooling/scripts/check-migrations-additive.mjs
      - tooling/scripts/rehearse-control-plane-migrations.sh
      - tooling/scripts/check-ops-budgets.mjs
      - tooling/scripts/compare-connect-performance.mjs
      - tooling/scripts/windows-package-components.mjs
      - tooling/scripts/prune-merged-branches.mjs
      - tooling/scripts/tests/*.test.mjs
      - tooling/scripts/publish-managed-catalog.rb
      - tooling/scripts/write-dedirock-hy2-catalog-sources.rb
      - tooling/scripts/tests/publish-managed-catalog.test.rb
      - tooling/scripts/provision-reality-node.rb
      - tooling/scripts/tests/provision-reality-node.test.rb
      - tooling/ops/hy2/**
      - .github/workflows/services-ci.yml
      # desktop-update-sign-workflow.test.mjs guards this file; run it on every edit.
      - .github/workflows/desktop-update-sign.yml
      # screenshot-nightly-split.test.mjs guards this file the same way.
      - .github/workflows/screenshots-nightly.yml

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.event_name != 'workflow_call' }}

jobs:
  control-plane:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # the download-page check reads constants out of each released commit
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Type-check
        # The Worker is deployed from this source; a type error here is a runtime
        # error on a production domain. The second pass counts
        # noUncheckedIndexedAccess errors and fails only when that count rises.
        run: npm run typecheck

      - name: Unchecked index ratchet
        working-directory: ${{ github.workspace }}
        run: node --test services/unchecked-index-ratchet.test.mjs

      - name: Test
        run: |
          npm test
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            const total = JSON.parse(readFileSync("./coverage/coverage-summary.json", "utf8")).total
            const line = `coverage floor auth/sessions/quota/ledger: lines ${total.lines.pct}% branches ${total.branches.pct}% functions ${total.functions.pct}% statements ${total.statements.pct}%`
            console.log(line)
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n")
          '

      - name: Download page guards can still fail
        # The reachability guard is the one check standing between "the manifest
        # says so" and "the bucket serves it". A guard that cannot fail is worth
        # nothing, so its refusals are exercised against a local origin.
        working-directory: ${{ github.workspace }}
        run: node --test tooling/scripts/tests/generate-release-center.test.mjs

      # A release published while this page still names the version before it is
      # invisible until a customer downloads the wrong build, so it is checked
      # here rather than discovered there.
      - name: Download page matches what customers are offered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --quiet origin windows-updates
          node tooling/scripts/generate-release-center.mjs --check

      - name: Policy signing contract
        # The signature-aware implementations must agree on the key and signed byte
        # prefix. Drift is silent: signatures verify nowhere, every signed policy
        # reads as untrustworthy, and managed direct routing stops fleet-wide.
        # This job's default directory is services/control-plane. Use the
        # repository-relative path from there; the previous command looked for
        # services/control-plane/tooling/... and made an otherwise green PR red.
        run: ../../tooling/scripts/test-policy-signing-contract.sh

  service-agents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Exit metering agent
        # Folds counters that reset on restart into lifetime totals. Wrong in one
        # direction it bills twice, in the other it forgives whatever an account
        # used before a restart, and both look plausible from outside.
        run: python3 services/exit-agent/test_reconcile_and_report.py

      - name: Transactional node provisioner fixtures
        run: python3 tooling/scripts/tests/test_provision_tono_node.py

      - name: Exit configuration edit
        # Additive and idempotent by requirement: dropping the existing client
        # disconnects every account that still holds that credential, and claiming
        # work when there is none spends the one restart this change costs.
        run: python3 tooling/scripts/remote/test_exit_metering_config.py

      - name: Node provisioner fixtures
        run: ruby tooling/scripts/tests/provision-reality-node.test.rb

      - name: Home usage reporter
        run: python3 services/home-agent/test_report_example.py

      - name: Node restart verification fixtures
        run: python3 tooling/scripts/remote/test_node_verification.py

      - name: Node self-registration agent
        # Reports only running Tono services and never sends its token anywhere
        # but a bare HTTPS origin.
        run: python3 services/node-agent/test_tono_node_agent.py

      - name: Operator SSH collector jobs
        run: python3 -m unittest discover -s ops-panel/tests -p 'test_*.py'

      - name: Node rollback metadata fixtures
        run: python3 tooling/scripts/remote/test_node_rollback.py

      - name: hy2 carrier and handshake probes
        run: python3 -m unittest discover -s tooling/ops/hy2 -p 'test_*.py'

      - name: API relay end-to-end probe
        # Default certificate verification is the point of the probe: an
        # untrusted certificate through the relay must report a failure.
        # test_relay_stream_conf.py: the SNI allow-list the armed macOS
        # permit relies on (decision 086).
        run: python3 -m unittest discover -s tooling/ops/relay -p 'test_*.py'

      - name: Node install validator
        # Stubbed node root: a broken install must fail each check, and no
        # credential value may reach the output.
        run: python3 tooling/ops/node-install/test_check_node_install.py

  ops-contract:
    runs-on: ubuntu-24.04
    # Job-level permissions replace the workflow-level block entirely, so
    # contents: read has to be restated or checkout loses the tree.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install control-plane
        working-directory: services/control-plane
        run: npm ci

      - name: Install ops-console
        working-directory: services/ops-console
        run: npm ci

      - name: Contract purity
        working-directory: services/control-plane
        run: npm run check:contract && npm run check:budgets

      - name: Route coverage
        working-directory: services/control-plane
        run: npx vitest run test/ops-contract-routes.test.ts

      - name: Captured fixtures
        working-directory: services/ops-console
        run: npx vitest run test/captured-fixtures.test.ts

      - name: Fixture generator is byte-for-byte
        # The committed JSON is what the pages and Playwright specs render.
        # Regenerating it must not rewrite a byte, or the suite keeps passing
        # against files nobody can reproduce.
        working-directory: services/ops-console
        run: npx vitest run test/fixtures-generator.test.ts

      - name: Tooling script tests
        # windows-ci-paths.test.cjs needs js-yaml from apps/windows/app (pnpm
        # install, never done in this job) and runs in windows-ci.yml instead.
        # The glob is every *.test.mjs so a future script test is covered
        # without editing this step.
        run: node --test "tooling/scripts/tests/*.test.mjs"

      - name: Catalog publisher tests
        run: ruby tooling/scripts/tests/publish-managed-catalog.test.rb

      - name: Type-check the ops console
        working-directory: services/ops-console
        run: npm run typecheck

      - name: Build the console
        # npm run build ends in check-budgets.mjs, so a bundle that blows the
        # gzip or line budget fails here, before the report is written.
        working-directory: services/ops-console
        run: npm run build

      - name: Size ratchet report
        working-directory: services/ops-console
        run: node scripts/budget-report.mjs | tee "$RUNNER_TEMP/size-ratchet.md"

      - name: Post the size ratchet as a sticky PR comment
        # Fork PRs get a read-only GITHUB_TOKEN; posting would go red. Push
        # events have no PR to comment on. A red build with no comment is
        # intentional — default success() is clearer than a stale table.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- tono-size-ratchet -->';
            const table = fs.readFileSync(`${process.env.RUNNER_TEMP}/size-ratchet.md`, 'utf8');
            const body = `${marker}\n${table}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  migrations:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Prefixes from 0039 are unique
        # 0016/0017/0018 were reused before the sequence became unique; they
        # sit below the 0039 floor this check starts at, so they are exempt.
        # See services/control-plane/migrations/README.md. Uniqueness is a
        # hard failure; gaps emit a warning because departments are allocated
        # ranges with unused numbers on purpose.
        working-directory: ${{ github.workspace }}
        run: node tooling/scripts/check-migration-numbers.mjs

      - name: Apply every migration to an empty local D1
        # --persist-to makes the empty-local-D1 state explicit. Assertions
        # read d1_migrations via execute --json rather than grepping the
        # spinner: wrangler's pretty output repeats lines and is unreliable.
        # A second apply must be a no-op, or a restore would not be
        # idempotent. Never talks to Cloudflare: --local only, no CLOUDFLARE_*
        # secrets.
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          PERSIST="$RUNNER_TEMP/d1"
          npx wrangler d1 migrations apply DB --local --persist-to "$PERSIST" > "$RUNNER_TEMP/apply1.txt" 2>&1
          cat "$RUNNER_TEMP/apply1.txt"
          npx wrangler d1 execute DB --local --persist-to "$PERSIST" --json --command "select name from d1_migrations order by id" > "$RUNNER_TEMP/applied.json"
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const raw = readFileSync(`${process.env.RUNNER_TEMP}/applied.json`, 'utf8');
          const parsed = JSON.parse(raw);
          const rows = Array.isArray(parsed) ? parsed[0]?.results : parsed.results;
          if (!Array.isArray(rows)) {
            console.error('d1 execute --json did not return a results array');
            console.error(raw);
            process.exit(1);
          }
          const names = rows.map((row) => row.name).sort();
          const files = readdirSync('migrations').filter((name) => name.endsWith('.sql')).sort();
          const missing = files.filter((name) => !names.includes(name));
          const extra = names.filter((name) => !files.includes(name));
          if (missing.length || extra.length || names.length !== files.length) {
            console.error('applied d1_migrations do not match migrations/*.sql');
            if (missing.length) console.error(`missing from d1: ${missing.join(', ')}`);
            if (extra.length) console.error(`extra in d1: ${extra.join(', ')}`);
            process.exit(1);
          }
          console.log(`applied ${names.length} migrations match migrations/*.sql`);
          NODE
          npx wrangler d1 migrations apply DB --local --persist-to "$PERSIST" > "$RUNNER_TEMP/apply2.txt" 2>&1
          cat "$RUNNER_TEMP/apply2.txt"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const out = readFileSync(`${process.env.RUNNER_TEMP}/apply2.txt`, 'utf8');
          if (!/no migrations to apply/i.test(out)) {
            console.error('second apply was not a no-op:');
            console.error(out);
            process.exit(1);
          }
          NODE
          npx wrangler d1 migrations list DB --local --persist-to "$PERSIST" > "$RUNNER_TEMP/list.txt" 2>&1
          cat "$RUNNER_TEMP/list.txt"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const out = readFileSync(`${process.env.RUNNER_TEMP}/list.txt`, 'utf8');
          if (!/no migrations to apply/i.test(out)) {
            console.error('migrations list still reports unapplied files:');
            console.error(out);
            process.exit(1);
          }
          NODE

  ops-console-e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: services/ops-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install exactly what the lockfile pins
        run: npm ci

      - name: Install Playwright's Chromium and its OS deps
        run: npx playwright install --with-deps chromium

      - name: Functional assertions only
        # Screenshot baselines were captured on macOS at DPR 2; Linux fonts
        # would fail every visual comparison. --ignore-snapshots keeps the
        # functional assertions and skips the pixel checks. playwright.config.ts
        # starts the fixtures dev server itself; CI makes it non-reusing, one
        # worker per shard. No dorny/paths-filter: the workflow is already
        # path-filtered to services/**, and the fixture server reads control-plane
        # contract source through Vite aliases, so a control-plane-only change
        # still needs these specs.
        run: npx playwright test --shard=${{ matrix.shard }}/4 --ignore-snapshots
