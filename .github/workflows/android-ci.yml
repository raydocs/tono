name: android-ci

# Android test client (apps/android). Not part of ci-gate yet: it runs on PRs that touch
# apps/android and on dispatch, builds libbox from the pinned sing-box source, runs JVM tests,
# builds a debug-signed test APK (no release variant exists), then installs it on a KVM-backed
# x86_64 emulator and records on-device evidence. Artifacts expire; nothing is published.
on:
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      # The PR head itself (not the merge ref), so the APK name and bytes map to one pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore libbox built from the pin
        id: libbox
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/android/mobile/libs/libbox.aar
          key: libbox-${{ hashFiles('apps/android/supply-chain/sing-box/**') }}
      - name: Build libbox from the pinned sing-box source
        if: steps.libbox.outputs.cache-hit != 'true'
        env:
          GOMAXPROCS: '4'
        run: supply-chain/sing-box/build-libbox.sh mobile/libs
      # The Gradle build re-verifies libbox.aar against supply-chain/sing-box/libbox.aar.sha256
      # whether it came from the cache or the build above.
      - name: Routing lists match this desktop checkout
        run: python3 scripts/routing/sync-desktop-routing.py --desktop "$GITHUB_WORKSPACE" --check
      - name: Unit tests, lint, debug APK and instrumentation APK
        run: >
          ./gradlew --no-daemon --stacktrace
          :routing:testDebugUnitTest :mobile:testDebugUnitTest
          :mobile:lintDebug :mobile:assembleDebug :mobile:assembleDebugAndroidTest
      - name: Generated configs pass the pinned sing-box CLI check
        run: scripts/routing/check-singbox-configs.sh routing/build/singbox-configs
      - name: Name the test APK
        id: apk
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' mobile/build.gradle.kts)"
          name="tono-mobile-${version}-test-${SOURCE_SHA::9}"
          mkdir -p out
          cp mobile/build/outputs/apk/debug/mobile-debug.apk "out/$name.apk"
          cp mobile/build/outputs/apk/androidTest/debug/mobile-debug-androidTest.apk out/instrumentation.apk
          (cd out && sha256sum "$name.apk" | tee "$name.apk.sha256")
          echo "source $SOURCE_SHA" >> "out/$name.apk.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            apps/android/out/${{ steps.apk.outputs.name }}.apk
            apps/android/out/${{ steps.apk.outputs.name }}.apk.sha256
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: instrumentation-apk
          path: apps/android/out/instrumentation.apk
          retention-days: 14
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-test-reports
          path: |
            apps/android/routing/build/reports/
            apps/android/mobile/build/reports/
          retention-days: 30
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.build.outputs.apk }}
          path: apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: instrumentation-apk
          path: apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the on-device evidence script
        run: |
          cat > evidence.sh <<'SH'
          set -euxo pipefail
          APP=com.raydocs.tono.mobile.test
          # A retry keeps the first attempt's evidence next to the second's.
          if [ -d evidence ]; then mv evidence "evidence-attempt-$(date +%s)"; fi
          mkdir -p evidence
          adb shell getprop ro.build.fingerprint | tee evidence/device.txt
          adb shell getprop ro.product.cpu.abi | tee -a evidence/device.txt
          adb shell wm size | tee -a evidence/device.txt
          adb shell wm density | tee -a evidence/device.txt
          adb shell settings put system screen_off_timeout 1800000
          adb shell svc power stayon true
          adb shell input keyevent 82 || true
          # Let the launcher finish its first-boot work; on swiftshader it can otherwise raise an ANR
          # dialog over the app. The test answers only foreign ANR dialogs and logs each one.
          sleep 60
          adb shell input keyevent 3
          # No -g: runtime permissions and VPN consent stay as on a fresh install.
          adb install -r apk/*-test-*.apk
          adb install -r apk/instrumentation.apk
          # One instrumentation call per test, pulling evidence after each, so an emulator crash
          # (seen on hosted runners) costs one test's evidence rather than all of it.
          set +e
          failed=""
          for c in DeviceEvidenceTest#a1_realSignInScreenAndLocalValidation DeviceEvidenceTest#a2_realSystemVpnConsentDialog \
                   DeviceEvidenceTest#a3_realEngineRefusesToConnectWithoutAccount DeviceEvidenceTest#a4_realCoreOnThisAbiAcceptsTheGeneratedConfig \
                   DeviceEvidenceTest#a5_realAppHonoursRemoveAnimations DeviceEvidenceTest#a6_realAppUnderSystemLightAndDarkTheme \
                   SystemSurfacesDeviceTest#s1_realQuickSettingsTileShowsSharedStatusAndOpensTheApp \
                   SystemSurfacesDeviceTest#s2_realWidgetInAndroidsWidgetHost SystemSurfacesDeviceTest#s3_fixtureWidgetAndNotificationStates \
                   DeviceEvidenceTest#b1_fixtureStatesRenderedOnDevice DeviceEvidenceTest#b2_fixtureMotionRecordedOnDevice \
                   DeviceEvidenceTest#b3_fixtureAtLargeFontScale \
                   HorizonUiDeviceTest#u1_accessibilityContractAndAtfOnEveryScreen HorizonUiDeviceTest#u2_primaryControlActsThroughRealTaps \
                   HorizonUiDeviceTest#u3_swipeUpOnTheDockOpensDetails HorizonUiDeviceTest#u4_glassBlursTheSceneBehindIt \
                   HorizonUiDeviceTest#u5_consentExplainedBeforeTheSystemDialog HorizonUiDeviceTest#u6_screenReaderOrderAndLabelsOnHome \
                   HorizonUiDeviceTest#u7_simplifiedChineseCopyFitsEveryScreen HorizonUiDeviceTest#u8_motionFrameByFrameAt60fps \
                   LargeTextDeviceTest#l1_largestSystemTextIsNeverCutOff; do
            t="${c#*#}"
            rec=""
            if [ "$t" = b2_fixtureMotionRecordedOnDevice ]; then
              # Recorded from the host: a screenrecord started inside the test kept the run open.
              adb shell screenrecord --time-limit 25 --bit-rate 8000000 /sdcard/Download/tono-fixture-motion.mp4 &
              rec=$!
            fi
            timeout 900 adb shell am instrument -w -r -e class "com.raydocs.tono.mobile.$c" \
              $APP.test/androidx.test.runner.AndroidJUnitRunner > "evidence/instrument-$t.txt"
            [ -n "$rec" ] && timeout 60 tail --pid="$rec" -f /dev/null
            grep -q '^OK (' "evidence/instrument-$t.txt" && echo "PASS $t" >> evidence/summary.txt || { echo "FAIL $t" >> evidence/summary.txt; failed="$failed $t"; }
            timeout 120 adb pull /sdcard/Android/data/$APP/files/evidence/. evidence/
            [ "$t" = b2_fixtureMotionRecordedOnDevice ] && timeout 120 adb pull /sdcard/Download/tono-fixture-motion.mp4 evidence/fixture-motion.mp4
          done
          # Leave the shared emulator settings as found, whatever a failed test left behind.
          adb shell settings put system font_scale 1.0
          adb shell settings put global animator_duration_scale 1
          adb shell cmd uimode night no
          timeout 60 adb logcat -d > evidence/logcat.txt
          ls -la evidence
          cat evidence/summary.txt
          set -e
          [ -z "$failed" ]
          SH
      - name: Install and run on an Android 14 x86_64 emulator
        id: attempt1
        continue-on-error: true
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash evidence.sh
      # One bounded retry: software-GPU emulators on hosted runners occasionally die mid-run.
      - name: Retry once on a fresh emulator
        if: steps.attempt1.outcome == 'failure'
        timeout-minutes: 55
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash evidence.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-emulator-evidence
          path: |
            evidence/
            evidence-attempt-*/
          retention-days: 90
          if-no-files-found: warn
