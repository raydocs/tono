# Nightly dump of production D1 `tono-control-plane` into the releases R2
# bucket. The dump must not leave Cloudflare: this workflow uploads nothing to
# GitHub Actions artifacts.
#
# Repository secrets (these names are not in services-ci.yml or the deploy
# script, which run wrangler from a logged-in laptop / do not talk to
# Cloudflare). Wrangler reads both from the environment; do not echo them.
#
#   CLOUDFLARE_API_TOKEN
#       API token with D1 read (export) on tono-control-plane and R2 write on
#       tono-releases. Same credential shape wrangler uses locally as
#       CLOUDFLARE_API_TOKEN.
#   CLOUDFLARE_ACCOUNT_ID
#       Cloudflare account that owns the D1 database and the tono-releases
#       bucket.
#
# A 90-day lifecycle rule on prefix `backups/` must be set in the Cloudflare
# dashboard; this workflow cannot install it. See docs/ops/d1-backups.md.

name: Control plane D1 backup

on:
  schedule:
    # 03:17 UTC, offset from the hour so it does not pile onto other crons.
    - cron: "17 3 * * *"
  # Manual re-run, so a flake or an infrastructure hiccup does not need a
  # pointless commit to retry.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-d1-backup
  # A cancelled upload can leave the gzip without its sidecar. Let a running
  # backup finish rather than overlapping a retry.
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "missing repository secrets:$missing" >&2
            exit 1
          fi

      - name: Install exactly what the lockfile pins
        working-directory: services/control-plane
        run: npm ci

      - name: Export production D1 and put it in the releases bucket
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: tooling/scripts/backup-control-plane-d1.sh

      - name: Fail if the uploaded object is missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OBJECT_KEY: ${{ steps.backup.outputs.object_key }}
        working-directory: services/control-plane
        run: |
          set -eu
          if [ -z "$OBJECT_KEY" ]; then
            echo "backup step emitted no object_key" >&2
            exit 1
          fi
          # Default Actions bash is `pipefail`. `wrangler --pipe | head -c 1`
          # then dies with SIGPIPE (141) after the first byte even when the
          # object exists. Turn it off so the failure we keep is "missing or
          # empty object", not a successful short read.
          set +o pipefail
          probe=$(npx wrangler r2 object get "tono-releases/${OBJECT_KEY}" \
            --remote --pipe --config wrangler.jsonc | head -c 1)
          status=$?
          if [ -z "$probe" ]; then
            echo "uploaded object is missing or empty: $OBJECT_KEY (wrangler exit $status)" >&2
            exit 1
          fi
