# Wraps an accepted macos-release.yml zip in the customer disk image
# (tooling/scripts/make-macos-dmg.sh). It builds nothing: the app inside the
# image is the accepted zip's Tono.app, byte for byte, so the candidate identity
# the owner's evidence names does not change. Uses the same repository signing
# and notarization secrets as macos-release.yml; never the Sparkle key.
name: macOS disk image
on:
  workflow_dispatch:
    inputs:
      source:
        description: The accepted zip's source - a successful macos-release.yml run id on release/macos (artifacts expire after 7 days), or its published tag tono-macos-<version>-build<n>
        required: true
        type: string
      zip_sha256:
        description: SHA-256 of the accepted zip, as the owner's G1 evidence names it
        required: true
        type: string
      sign:
        description: Sign, notarize and staple the image (false = layout and byte proof only)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-dmg-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    env:
      TONO_MACOS_NOTARY_PROFILE: tono-macos-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch the accepted zip
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          ZIP_SHA256: ${{ inputs.zip_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$ZIP_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo "FATAL: zip_sha256 must be 64 hex digits" >&2; exit 1; }
          if printf '%s' "$SOURCE" | grep -Eq '^tono-macos-[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$'; then
            # The published tag keeps the accepted zip after the run's artifacts expire.
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE")
            printf '%s\n' "$release" | jq -e '.draft == false' > /dev/null \
              || { echo "FATAL: $SOURCE is a draft release" >&2; exit 1; }
            name=$(printf '%s\n' "$release" | jq -er '[.assets[].name | select(test("^Tono-[0-9.]+-build[0-9]+-arm64\\.zip$"))] | if length == 1 then .[0] else error("expected one release zip") end')
            gh release download "$SOURCE" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/accepted"
            echo "ZIP_PATH=$RUNNER_TEMP/accepted/$name" >> "$GITHUB_ENV"
            echo "SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE" --jq .sha)" >> "$GITHUB_ENV"
            exit 0
          fi
          RELEASE_RUN_ID=$SOURCE
          case "$RELEASE_RUN_ID" in ''|*[!0-9]*) echo "FATAL: source must be a run number or a tono-macos-<version>-build<n> tag" >&2; exit 1 ;; esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")
          printf '%s\n' "$run" | jq -c '{id, path, event, head_branch, head_sha, conclusion}'
          printf '%s\n' "$run" | jq -e '.path == ".github/workflows/macos-release.yml" and .event == "workflow_dispatch"
            and .head_branch == "release/macos" and .status == "completed" and .conclusion == "success"' > /dev/null \
            || { echo "FATAL: run $RELEASE_RUN_ID is not a successful macos-release.yml dispatch on release/macos" >&2; exit 1; }
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | test("^Tono-[0-9.]+-build[0-9]+-arm64$")) | select(.expired | not) | .name] | if length == 1 then .[0] else error("expected one unexpired release zip artifact") end')
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/accepted"
          echo "ZIP_PATH=$RUNNER_TEMP/accepted/$name.zip" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(printf '%s' "$run" | jq -r .head_sha)" >> "$GITHUB_ENV"

      - name: Load the Developer ID identity and notarytool credentials
        if: inputs.sign
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -eu
          keychain_path="$RUNNER_TEMP/tono-macos-dmg.keychain-db"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$certificate_path" "$notary_key_path"' EXIT
          printf '%s' "$MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -x
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path" > /dev/null
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "\"$MACOS_DEVELOPER_ID_APPLICATION_IDENTITY\"" > /dev/null \
            || { echo "FATAL: the imported .p12 does not provide the configured identity" >&2; exit 1; }
          xcrun notarytool store-credentials "$TONO_MACOS_NOTARY_PROFILE" \
            --key "$notary_key_path" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --keychain "$keychain_path" > /dev/null

      - name: Build the disk image around the accepted app
        env:
          TONO_MACOS_SIGNING_IDENTITY: ${{ inputs.sign && secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY || '' }}
          ZIP_SHA256: ${{ inputs.zip_sha256 }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [ -z "$TONO_MACOS_SIGNING_IDENTITY" ]; then unset TONO_MACOS_NOTARY_PROFILE; fi
          tooling/scripts/make-macos-dmg.sh "$ZIP_PATH" "$ZIP_SHA256" "$RUNNER_TEMP/dmg"
          {
            echo "### macOS disk image"
            echo "- source: $SOURCE at \`$SOURCE_SHA\`"
            echo "- accepted zip sha256: \`$ZIP_SHA256\`"
            echo "- image: \`$(cd "$RUNNER_TEMP/dmg" && shasum -a 256 ./*.dmg)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-dmg-${{ inputs.sign && 'signed' || 'unsigned' }}-${{ inputs.source }}
          path: ${{ runner.temp }}/dmg/
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain
        if: always() && inputs.sign
        run: |
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/tono-macos-dmg.keychain-db" || true

  # Build provenance for the disk image this run uploaded (decision 079 D8-A:
  # generated and auditable with `gh attestation verify`; clients do not check
  # it). An unsigned layout-proof image is attested too and keeps its -unsigned
  # name: provenance says where bytes came from, not that Apple notarized them.
  # The only job holding an OIDC token or attestation write; it checks out and
  # runs no repository code and sees no secret. A failed attestation fails the run.
  attest:
    needs: dmg
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-dmg-${{ inputs.sign && 'signed' || 'unsigned' }}-${{ inputs.source }}
          path: ${{ runner.temp }}/attest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/attest/*.dmg
