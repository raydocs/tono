name: macOS CI

on:
  # Manual re-run, so a flake or an infrastructure hiccup does not need a
  # pointless commit to retry.
  workflow_dispatch:
  pull_request:
    paths:
      - apps/macos/**
      - tooling/scripts/**
      - .github/workflows/macos-ci.yml
  # Every branch, not just the default one. This repository is a fork, and no
  # `pull_request` event has ever produced a run here — PR #1 merged without one.
  # Restricted to `main` and paired with a trigger that does not fire, this
  # workflow could only ever have run after a merge, which is the wrong time to
  # learn something is broken. It is also why `macos-ci.yml` existed for days and
  # never executed once.
  push:
    paths:
      - apps/macos/**
      - tooling/scripts/**
      - .github/workflows/macos-ci.yml

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sing-box-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and verify fixed darwin-arm64 input
        run: sh tooling/scripts/prepare-macos-sing-box.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sing-box-darwin-arm64
          path: apps/macos/Tono/Resources/sing-box
          if-no-files-found: error
          retention-days: 14

  build:
    needs: sing-box-input
    # The app uses macOS 26 APIs — `glassEffect` among them — so a macos-15 image
    # cannot compile it. On that runner every job that builds the app failed with
    # "value of type 'some View' has no member 'glassEffect'", which reads like a
    # code error and is really a missing SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sing-box-darwin-arm64
          path: apps/macos/Tono/Resources
      - name: Verify core and build current helper
        run: |
          chmod +x apps/macos/Tono/Resources/sing-box
          sh tooling/scripts/verify-macos-sing-box.sh
          tooling/scripts/build-core-helper.sh

      - name: Build the macOS app without signing
        run: |
          xcodebuild \
            -project apps/macos/Tono.xcodeproj \
            -scheme Tono \
            -configuration Release \
            -derivedDataPath apps/macos/build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package macOS Beta App
        run: |
          mkdir -p apps/macos/dist
          ditto -c -k --keepParent apps/macos/build/Build/Products/Release/Tono.app apps/macos/dist/Tono-macOS-beta.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tono-macos-beta-${{ github.sha }}
          path: apps/macos/dist/Tono-macOS-beta.zip
          if-no-files-found: error
          retention-days: 7

      - name: Run the TonoTests unit tests
        env:
          TEST_RUNNER_TONO_EMIT_SINGBOX: ${{ runner.temp }}/sing-box-product.json
        run: |
          xcodebuild \
            -project apps/macos/Tono.xcodeproj \
            -scheme Tono \
            -configuration Debug \
            -resultBundlePath apps/macos/test-results/TonoTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            test

      - name: Preserve native test results and render attachments
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tono-macos-tests-${{ github.sha }}
          path: |
            apps/macos/test-results/TonoTests.xcresult
            apps/macos/test-results/renders/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Check actual Swift runtime bytes with fixed core and helper
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, hashlib
          config = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sing-box-product.json'
          assert config.is_file(), 'Swift emitter did not produce runtime bytes'
          subprocess.run(['apps/macos/Tono/Resources/sing-box', 'check', '-c', str(config)], check=True, timeout=15)
          subprocess.run(['apps/macos/Tono/Resources/tono-core-helper', '--runtime-contract-check', str(config)], check=True, timeout=5)
          print('Swift runtime SHA256:', hashlib.sha256(config.read_bytes()).hexdigest())
          PY

  policy-tests:
    needs: sing-box-input
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sing-box-darwin-arm64
          path: apps/macos/Tono/Resources
      - run: chmod +x apps/macos/Tono/Resources/sing-box

      - name: Subscription URL policy
        run: tooling/scripts/test-subscription-url-policy.sh

      - name: Helper peer authorization
        run: tooling/scripts/test-helper-peer-authorization.sh

      - name: Multi-exit policy
        run: tooling/scripts/test-multi-exit-policy.sh "$GITHUB_WORKSPACE/tooling/scripts/tests/fixtures/multi-vless-reality.yaml"

      - name: Policy signing contract
        # Four implementations must agree on the signing key and the signed byte
        # prefix. Drift is silent: signatures verify nowhere, every signed policy
        # reads as untrustworthy, and managed direct routing stops fleet-wide.
        run: tooling/scripts/test-policy-signing-contract.sh

      - name: Mixed proxy requires authenticated origin HTTPS
        run: python3 tooling/scripts/tests/test_macos_mixed_probe.py

      - name: macOS incident regressions
        run: tooling/scripts/test-macos-incident-regressions.sh

      # Protected sing-box reload is stop/start, not Mihomo hot reload.
      # Its process replacement is exercised by the helper lifecycle test.

      - name: Install lifecycle recovery safety (no root)
        run: python3 tooling/scripts/tests/test_helper_install_recovery.py

      - name: Release archive installs as Tono.app
        run: python3 tooling/scripts/tests/test_macos_archive_layout.py

      - name: Helper signing timestamp and offline test boundary
        run: python3 tooling/scripts/tests/test_helper_signing_timestamp.py

      - name: Notarization refusal and diagnostic privacy
        run: python3 tooling/scripts/tests/test_notarize_macos.py

      - name: Candidate signing workflow boundaries
        run: ruby tooling/scripts/tests/macos-candidate-workflow.test.rb

      - name: Sparkle signing tool selection
        run: python3 tooling/scripts/tests/test_sparkle_tool.py

      - name: Appcast publisher validation
        run: node --test tooling/scripts/tests/publish-macos-appcast.test.mjs

  # Split out because these need root. Locally the helper's own self-test prints
  # `PF syntax check skipped (needs root)` and the lifecycle test refuses
  # outright, so the checks that matter most — does pfctl actually accept this
  # ruleset, and does a re-arm withdraw a permit the session still needs — were
  # the ones a developer was least likely to have run. Both faults they cover
  # shipped, in consecutive builds. On a runner they run every time.
  privileged-tests:
    needs: sing-box-input
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sing-box-darwin-arm64
          path: apps/macos/Tono/Resources
      - name: Verify core input
        run: |
          chmod +x apps/macos/Tono/Resources/sing-box
          sh tooling/scripts/verify-macos-sing-box.sh

      - name: Build the privileged helper
        run: tooling/scripts/build-core-helper.sh

      - name: Place what an install would place
        # The core lifecycle test starts the privileged core, so it needs the two
        # things an install puts on disk: the runtime directory and the core
        # binary at its privileged path. Without them `CoreManager` cannot be
        # constructed and the failure reads only as "could not construct the core
        # manager".
        #
        # Done here rather than inside the self-test: fabricating an installation
        # is the installer's job, and a test that quietly creates its own
        # privileged paths hides what it depends on.
        run: |
          sudo /usr/bin/install -d -o root -g wheel -m 0755 /var/run/tono-core
          sudo /usr/bin/install -d -o root -g wheel -m 0755 /Library/PrivilegedHelperTools
          sudo /usr/bin/install -o root -g wheel -m 0755 \
            apps/macos/Tono/Resources/sing-box /Library/PrivilegedHelperTools/tono-sing-box

      - name: Helper self-test including the PF parse
        run: sudo apps/macos/Tono/Resources/tono-core-helper --self-test

      - name: Helper lifecycle self-test
        # Loads into an anchor no parent ruleset references, so pfctl parses and
        # installs it for real while no packet is ever evaluated against it.
        run: sudo apps/macos/Tono/Resources/tono-core-helper --lifecycle-self-test

      - name: Helper core lifecycle self-test
        # Starts the installed core against a config staged through the real
        # digest check, in the `Tono-Dev` directory production already accepts, so
        # no live configuration is involved and no tunnel is created.
        run: sudo apps/macos/Tono/Resources/tono-core-helper --core-lifecycle-self-test

      - name: Helper staging refusal matrix
        # Proves ownership, permission, and symlink enforcement by constructing
        # the failing cases, which needs the ability to chown to another user.
        run: sudo apps/macos/Tono/Resources/tono-core-helper --staging-self-test
