# Operator setup. Every one of these repository secrets must exist before this
# workflow can run; each job fails with an explicit list of what is missing
# rather than producing an unsigned, un-notarized, or unsigned-feed release.
#
#   MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64
#       base64 of the .p12 export of the "Developer ID Application: ... (YY57758GS7)"
#       certificate and its private key.
#   MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD
#       the export password for that .p12.
#   MACOS_DEVELOPER_ID_APPLICATION_IDENTITY
#       the exact identity string, e.g. "Developer ID Application: Example (YY57758GS7)".
#   MACOS_KEYCHAIN_PASSWORD
#       any strong string; it only unlocks the throwaway keychain on the runner.
#   APPLE_NOTARY_ISSUER_ID
#       App Store Connect API issuer UUID used by notarytool.
#   APPLE_NOTARY_KEY_ID
#       App Store Connect API key id used by notarytool.
#   APPLE_NOTARY_PRIVATE_KEY_P8_BASE64
#       base64 of the AuthKey_<key-id>.p8 App Store Connect private key.
#   SPARKLE_ED_PRIVATE_KEY
#       the Sparkle EdDSA private key exported with `generate_keys -x`, matching
#       SUPublicEDKey in apps/macos/Tono/Info.plist. Only the gated
#       macos-appcast environment may read it.
#
# The appcast job additionally requires release notes committed at
# apps/macos/release-notes/build<CFBundleVersion>.md, and it only ever runs
# tooling/scripts/publish-macos-appcast.mjs in --dry-run mode: publishing the
# feed stays a separate, reviewed step.

name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact CFBundleShortVersionString (MARKETING_VERSION) to release, e.g. 0.0.2
        required: true
        type: string
  push:
    tags:
      - tono-macos-*-build*

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A job-level `if:` on the branch is a guard that cannot fail. GitHub records a
  # skipped job as a success, so dispatching this workflow from the wrong ref
  # produced a green run that had built and released nothing — the same shape
  # that once left the Windows channel unadvanced for days while every run
  # reported success. This job carries no condition, so a wrong ref goes red.
  branch:
    runs-on: macos-26
    steps:
      - name: Refuse a ref that is not the release line
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] \
            && [ "$GITHUB_REF" != refs/heads/release/macos ]; then
            echo "::error::A macOS release must run from refs/heads/release/macos or a tono-macos-*-build* tag, but this run is on $GITHUB_REF. Nothing was built."
            exit 1
          fi
          echo "running from $GITHUB_REF"

  build:
    # Manual releases belong to the macOS release line. A tag is accepted only
    # after the ancestry check below proves it names a commit on that line.
    needs: branch
    runs-on: macos-26
    outputs:
      short_version: ${{ steps.release-version.outputs.short_version }}
      build: ${{ steps.release-version.outputs.build }}
      artifact_name: ${{ steps.release-version.outputs.artifact_name }}
      enclosure_url: ${{ steps.release-version.outputs.enclosure_url }}
      release_link: ${{ steps.release-version.outputs.release_link }}
    env:
      TONO_MACOS_NOTARY_PROFILE: tono-macos-release
      # Not `${{ runner.temp }}`: the runner context is unavailable in a job-level
      # env, so referencing it there is an invalid expression and the workflow
      # fails at startup — before its own trigger is even evaluated. That is why
      # this ran, and failed, on every branch push while claiming to watch tags
      # only, and why it has never completed once. `$RUNNER_TEMP` is the same
      # directory and is a plain environment variable, which is what the rest of
      # this file already uses.
      KEYCHAIN_PATH: ${{ runner.temp }}/tono-macos-release.keychain-db

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require the macOS release line
        run: |
          set -eu
          git fetch --no-tags origin release/macos
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release/macos; then
            echo "FATAL: $GITHUB_SHA is not on release/macos; refusing a macOS release from another platform line." >&2
            exit 1
          fi

      - name: Require every macOS signing and notarization secret
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -eu
          missing=
          for name in \
            MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 \
            MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD \
            MACOS_DEVELOPER_ID_APPLICATION_IDENTITY \
            MACOS_KEYCHAIN_PASSWORD \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_PRIVATE_KEY_P8_BASE64; do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=macOS release secrets are not configured::$missing"
            echo "FATAL: refusing to build a macOS release without Developer ID signing and notarization." >&2
            echo "An unsigned or un-notarized Tono.app cannot install its privileged helper and must never" >&2
            echo "be offered to Sparkle clients. Configure these repository secrets, then re-run:" >&2
            for name in $missing; do
              echo "  - $name" >&2
            done
            exit 1
          fi

      - name: Resolve the release version from the project, not from the trigger
        id: release-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            short_version=$INPUT_VERSION
            expected_build=
          else
            case "$GITHUB_REF_NAME" in
              tono-macos-*-build*) ;;
              *)
                echo "FATAL: tag $GITHUB_REF_NAME is not tono-macos-<short-version>-build<build>." >&2
                exit 1
                ;;
            esac
            short_version=${GITHUB_REF_NAME#tono-macos-}
            short_version=${short_version%-build*}
            expected_build=${GITHUB_REF_NAME##*-build}
          fi
          case "$short_version" in
            *[!0-9.]*|''|.*|*.)
              echo "FATAL: $short_version is not a dotted numeric CFBundleShortVersionString." >&2
              exit 1
              ;;
          esac
          settings=$(
            xcodebuild \
              -project apps/macos/LiquidClash.xcodeproj \
              -scheme LiquidClash \
              -configuration Release \
              -showBuildSettings 2>/dev/null
          )
          marketing_version=$(printf '%s\n' "$settings" | awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}')
          project_build=$(printf '%s\n' "$settings" | awk -F' = ' '/ CURRENT_PROJECT_VERSION = /{print $2; exit}')
          if [ "$marketing_version" != "$short_version" ]; then
            echo "FATAL: requested $short_version but the project MARKETING_VERSION is $marketing_version." >&2
            echo "Commit the version bump before releasing; the feed must describe the committed build." >&2
            exit 1
          fi
          case "$project_build" in
            ''|*[!0-9]*)
              echo "FATAL: CURRENT_PROJECT_VERSION $project_build is not an integer build number." >&2
              exit 1
              ;;
          esac
          if [ -n "$expected_build" ] && [ "$expected_build" != "$project_build" ]; then
            echo "FATAL: tag $GITHUB_REF_NAME claims build $expected_build but the project builds $project_build." >&2
            exit 1
          fi
          artifact_name="Tono-$short_version-build$project_build-arm64"
          tag="tono-macos-$short_version-build$project_build"
          {
            echo "short_version=$short_version"
            echo "build=$project_build"
            echo "artifact_name=$artifact_name"
            echo "enclosure_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$artifact_name.zip"
            echo "release_link=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Subscription URL policy
        run: tooling/scripts/test-subscription-url-policy.sh

      - name: Helper peer authorization
        run: tooling/scripts/test-helper-peer-authorization.sh

      - name: Multi-exit policy
        run: tooling/scripts/test-multi-exit-policy.sh "$GITHUB_WORKSPACE/tooling/scripts/tests/fixtures/multi-vless-reality.yaml"

      - name: macOS incident regressions
        run: tooling/scripts/test-macos-incident-regressions.sh

      - name: TonoTests XCTest target
        run: |
          set -eu
          xcodebuild test \
            -project apps/macos/LiquidClash.xcodeproj \
            -scheme LiquidClash \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Load the Developer ID identity and notarytool credentials
        env:
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -eu
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$certificate_path" "$notary_key_path"' EXIT
          printf '%s' "$MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -x
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -F "\"$MACOS_DEVELOPER_ID_APPLICATION_IDENTITY\"" > /dev/null; then
            echo "::error title=Developer ID identity not usable::MACOS_DEVELOPER_ID_APPLICATION_IDENTITY does not match the imported certificate"
            echo "FATAL: the imported .p12 does not provide $MACOS_DEVELOPER_ID_APPLICATION_IDENTITY." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$TONO_MACOS_NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH" > /dev/null

      - name: Build, sign and notarize the release archive
        env:
          TONO_MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          TONO_MACOS_NOTARIZE: '1'
          ARTIFACT_NAME: ${{ steps.release-version.outputs.artifact_name }}
        run: |
          set -eu
          tooling/scripts/package-macos-test.sh "$RUNNER_TEMP/release" "$ARTIFACT_NAME"
          /usr/bin/codesign --verify --deep --strict --all-architectures "$RUNNER_TEMP/release/$ARTIFACT_NAME.app"
          /usr/bin/xcrun stapler validate "$RUNNER_TEMP/release/$ARTIFACT_NAME.app"
          /usr/sbin/spctl -a -t exec -vv "$RUNNER_TEMP/release/$ARTIFACT_NAME.app"

      - name: Upload the notarized archive for the gated appcast job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.release-version.outputs.artifact_name }}
          path: ${{ runner.temp }}/release/${{ steps.release-version.outputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove the release keychain
        if: always()
        run: |
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" || true

  validate-appcast:
    needs: build
    runs-on: macos-26
    environment: macos-appcast
    env:
      RELEASE_SHORT_VERSION: ${{ needs.build.outputs.short_version }}
      RELEASE_BUILD: ${{ needs.build.outputs.build }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
      ENCLOSURE_URL: ${{ needs.build.outputs.enclosure_url }}
      RELEASE_LINK: ${{ needs.build.outputs.release_link }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Require the Sparkle EdDSA signing key and committed release notes
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${SPARKLE_ED_PRIVATE_KEY-}" ]; then
            echo "::error title=SPARKLE_ED_PRIVATE_KEY is not configured::the macos-appcast environment has no Sparkle EdDSA key"
            echo "FATAL: refusing to prepare a Sparkle feed entry without the release EdDSA key." >&2
            echo "Tono ships SUVerifyUpdateBeforeExtraction, so an unsigned or wrongly signed enclosure is" >&2
            echo "either rejected by every client or, worse, a hand-edited feed that nobody can verify." >&2
            echo "Export the key with Sparkle's generate_keys -x and store it as the SPARKLE_ED_PRIVATE_KEY" >&2
            echo "secret in the macos-appcast environment, then re-run." >&2
            exit 1
          fi
          notes_path="apps/macos/release-notes/build$RELEASE_BUILD.md"
          if [ ! -s "$notes_path" ]; then
            echo "::error title=Release notes are missing::$notes_path"
            echo "FATAL: $notes_path does not exist or is empty." >&2
            echo "Sparkle release notes must be reviewed in git, not typed into the signed feed by hand." >&2
            exit 1
          fi

      - name: Download the notarized archive built from this commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release

      - name: Locate the pinned Sparkle 2.9.4 sign_update tool
        run: |
          set -eu
          resolved=apps/macos/LiquidClash.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if ! grep -q '"version" : "2.9.4"' "$resolved"; then
            echo "::error title=Sparkle pin drifted::$resolved no longer pins Sparkle 2.9.4"
            echo "FATAL: the signing tool must come from the same Sparkle version the app embeds." >&2
            exit 1
          fi
          xcodebuild \
            -project apps/macos/LiquidClash.xcodeproj \
            -resolvePackageDependencies \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-sparkle" > /dev/null
          sign_update=$(
            find "$RUNNER_TEMP/DerivedData-sparkle/SourcePackages/artifacts" \
              -type f -name sign_update -perm -111 2>/dev/null | head -n 1
          )
          if [ -z "$sign_update" ]; then
            echo "::error title=Sparkle sign_update not found::the resolved Sparkle artifact bundle has no bin/sign_update"
            echo "FATAL: cannot sign the enclosure without Sparkle's own sign_update tool." >&2
            echo "This workflow never implements EdDSA signing itself; install the Sparkle 2.9.4" >&2
            echo "distribution's bin/sign_update on the runner and re-run." >&2
            exit 1
          fi
          echo "SIGN_UPDATE=$sign_update" >> "$GITHUB_ENV"

      - name: Sign the enclosure with Sparkle and verify the signature round-trips
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -eu
          key_path="$RUNNER_TEMP/sparkle-ed-key"
          trap 'rm -f "$key_path"' EXIT
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_path"
          archive="$RUNNER_TEMP/release/$ARTIFACT_NAME.zip"
          signature=$("$SIGN_UPDATE" --ed-key-file "$key_path" -p "$archive")
          if ! "$SIGN_UPDATE" --verify --ed-key-file "$key_path" "$archive" "$signature" > /dev/null; then
            echo "::error title=Sparkle signature did not verify::sign_update rejected its own signature"
            echo "FATAL: the EdDSA signature does not verify against SPARKLE_ED_PRIVATE_KEY." >&2
            echo "Never publish this enclosure; the key material or the archive is wrong." >&2
            exit 1
          fi
          printf '%s' "$signature" > "$RUNNER_TEMP/enclosure.sig"
          chmod 600 "$RUNNER_TEMP/enclosure.sig"

      - name: Validate the appcast entry against the exact bytes users download
        run: |
          set -eu
          /usr/bin/ditto -x -k "$RUNNER_TEMP/release/$ARTIFACT_NAME.zip" "$RUNNER_TEMP/extracted"
          app_path=$(find "$RUNNER_TEMP/extracted" -maxdepth 1 -type d -name '*.app' | head -n 1)
          if [ -z "$app_path" ]; then
            echo "FATAL: the downloaded archive does not contain a .app bundle." >&2
            exit 1
          fi
          node tooling/scripts/publish-macos-appcast.mjs \
            --app "$app_path" \
            --zip "$RUNNER_TEMP/release/$ARTIFACT_NAME.zip" \
            --version "$RELEASE_BUILD" \
            --short-version "$RELEASE_SHORT_VERSION" \
            --url "$ENCLOSURE_URL" \
            --link "$RELEASE_LINK" \
            --notes-file "apps/macos/release-notes/build$RELEASE_BUILD.md" \
            --signature-file "$RUNNER_TEMP/enclosure.sig" \
            --expected-path-prefix "/$GITHUB_REPOSITORY/releases/download/" \
            --dry-run | tee "$RUNNER_TEMP/appcast-validation.txt"
          {
            echo "### macOS appcast candidate"
            echo
            echo '```'
            cat "$RUNNER_TEMP/appcast-validation.txt"
            echo '```'
            echo
            echo "Publishing the feed is a separate reviewed step: re-run"
            echo "tooling/scripts/publish-macos-appcast.mjs without --dry-run once the"
            echo "GitHub Release for this build is published and immutable."
          } >> "$GITHUB_STEP_SUMMARY"
