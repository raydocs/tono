# Unsigned iOS Simulator XCTest on GitHub-hosted macos-26.
# Not Apple Xcode Cloud, not device acceptance, not a customer publish.
# TonoTests only: UITests and the sing-box mobile build stay on the
# Mac Studio runbook. Missing-core unit tests are expected to run
# without mobile.xcconfig (apps/ios/README.md).
name: iOS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios-ci.yml
  push:
    paths:
      - apps/ios/**
      - .github/workflows/ios-ci.yml

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-build-version
          xcrun simctl list runtimes

      - name: Run TonoTests on iOS Simulator
        run: |
          UDID=$(python3 - <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator")
          PY
          )
          echo "Using simulator $UDID"
          xcodebuild \
            -project apps/ios/Tono.xcodeproj \
            -scheme Tono \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath /tmp/tono-ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:TonoTests \
            test
