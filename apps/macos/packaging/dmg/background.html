<!doctype html>
<!-- Source of background.tiff (660x400 + 2x). Render with headless Chrome at
     --window-size=660,400 (and --force-device-scale-factor=2), set the 2x PNG to
     144 dpi with sips, then `tiffutil -cat 1x.tiff 2x.tiff` and `tiffutil -lzw`. -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:660px;height:400px;overflow:hidden}
  body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#1d2a3a;
    background:linear-gradient(180deg,#f6f9fc 0%,#eef4f9 62%,#e3edf5 100%)}
  .title{position:absolute;top:34px;width:100%;text-align:center;font-size:21px;font-weight:600;letter-spacing:.2px}
  .sub{position:absolute;top:66px;width:100%;text-align:center;font-size:13px;color:#5b6b7d}
  svg{position:absolute;left:250px;top:168px}
  .foot{position:absolute;bottom:26px;width:100%;text-align:center;font-size:12px;color:#6b7a8b;line-height:1.55}
</style></head><body>
  <div class="title">把 Tono 拖到「应用程序」文件夹</div>
  <div class="sub">Drag Tono onto Applications to install</div>
  <svg width="160" height="44" viewBox="0 0 160 44" aria-hidden="true">
    <path d="M8 22 H136" stroke="#3f7fc4" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>
    <path d="M128 9 L150 22 L128 35" fill="none" stroke="#3f7fc4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="foot">装好后从「应用程序」打开 Tono，不要直接在这个窗口里双击。<br>Open Tono from Applications, not from this window.</div>
</body></html>
