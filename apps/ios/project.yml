# XcodeGen spec: `xcodegen generate` in apps/ios writes Tono.xcodeproj (not committed).
# Requires Frameworks/Libbox.xcframework from supply-chain/build-libbox-apple.sh.
# Info.plists and entitlements are hand-written and referenced through build settings only;
# an `info:`/`entitlements:` key would make XcodeGen overwrite them.
name: Tono
options:
  bundleIdPrefix: com.raydocs.tono
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig
packages:
  TonoKit:
    path: TonoKit
targets:
  Tono:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "Tono.entitlements"]
      - path: Shared
      - path: Status
      - path: WidgetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TONO_BUNDLE_ID)
        PRODUCT_NAME: Tono
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Tono.entitlements
    dependencies:
      - package: TonoKit
        product: TonoKit
      - target: PacketTunnel
        embed: true
      - target: TonoWidgets
        embed: true
      - sdk: WidgetKit.framework
      # No libbox here: the tunnel extension is the only target that links the core (its ~40 MB of
      # Go code once, not twice); the app asks it for statistics (TunnelMessage.traffic).
      - sdk: NetworkExtension.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ["Info.plist", "PacketTunnel.entitlements"]
      - path: Shared
      - path: Status/StatusStore.swift
      - path: Status/StatusReload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TONO_BUNDLE_ID).tunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: TonoKit
        product: TonoKit
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
      # libbox's Go code calls UIDevice; the extension imports no UIKit itself, so link it explicitly.
      - sdk: UIKit.framework
  # Status widget (Home Screen, Lock Screen), Live Activity (Lock Screen, Dynamic Island) and the
  # iOS 18 Control Center switch. Reads the App Group status snapshot; switches only through
  # SetTunnelIntent, which iOS performs in the app process. iOS 17+ (the app itself stays 16+).
  TonoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
        excludes: ["Info.plist", "TonoWidgets.entitlements"]
      - path: WidgetUI
      - path: Status
      - path: App/Views/Theme.swift
      - path: App/Views/Components.swift
      - path: App/Resources
        excludes: ["PrivacyInfo.xcprivacy"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TONO_BUNDLE_ID).widgets
        PRODUCT_NAME: TonoWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/TonoWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: TonoKit
        product: TonoKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
  # Simulator-only UI tests of the DEBUG design preview (fixture data, no tunnel): interaction
  # wiring, VoiceOver labels, Apple's accessibility audit. Not shipped.
  TonoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TONO_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tono
    dependencies:
      - target: Tono
schemes:
  Tono:
    build:
      targets:
        Tono: all
        PacketTunnel: all
        TonoWidgets: all
        TonoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TonoUITests
    archive:
      config: Release
