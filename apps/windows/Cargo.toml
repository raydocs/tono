[workspace]
members = [
  "crates/tono-core",
  "crates/tono-authenticode",
]
# The vendored IPC library keeps its own edition, lint table and toolchain floor, so it is
# excluded rather than made a member — but it must be listed, or cargo refuses to build it
# standalone ("believes it's in a workspace when it's not"). tono-plugin-core, tono-logger and
# sysproxy are in the same situation: each is a plain crate with no [workspace] table of its
# own, pulled in only as a path dependency of the app/service workspaces, so it must be listed
# here too or `cargo` walking up from it treats this manifest as its (unlisted) workspace root.
exclude = [
  "vendor/kode-bridge",
  "vendor/sysproxy",
  "crates/tono-logger",
  "crates/tono-plugin-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
authors = ["Raydocs"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
