<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="./assets/image/logo.ico"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tono</title>
    <script>
      // Same default as appearance-preferences.ts: on unless explicitly turned off.
      let seaAppearance = true;
      try {
        const value = JSON.parse(localStorage.getItem('tono-ui-preferences') || '{}');
        seaAppearance = value?.newAppearance !== false;
      } catch {}
      if (seaAppearance) document.documentElement.dataset.seaAppearance = 'true';
    </script>
    <!-- Tauri adds its runtime CSP nonce to bundled style elements. Runtime CSS-in-JS reads
         this marked element's DOM `nonce` property and reuses it for styles created later. -->
    <style data-tauri-csp-nonce-source>
      :root {
        --bg-color: #f5f5f5;
        --text-color: #333;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #2e303d;
          --text-color: #ffffff;
          color-scheme: dark;
        }
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        color: var(--text-color);
      }

      #root {
        width: 100%;
        height: 100%;
      }

      #initial-loading-overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        z-index: 9999;
        transition: opacity 0.2s ease-out;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
      }

      #initial-loading-overlay::before {
        content: 'Tono';
        font: 600 24px/1 system-ui, sans-serif;
        letter-spacing: 0.04em;
      }

      #initial-loading-overlay::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid color-mix(in srgb, var(--text-color) 22%, transparent);
        border-top-color: var(--text-color);
        border-radius: 50%;
        animation: tono-initial-spin 0.8s linear infinite;
      }

      @keyframes tono-initial-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loading-overlay::after {
          animation-duration: 1.8s;
        }
      }

      html[data-sea-appearance='true'] {
        --bg-color: #0b0a12;
        --text-color: #f6f2ec;
        color-scheme: dark;
        background: #0b0a12;
      }
      html[data-sea-appearance='true'] #initial-loading-overlay::before {
        content: '';
        width: 48px;
        height: 48px;
        background: url('./assets/image/tono-mark.svg') center / contain no-repeat;
      }
      html[data-sea-appearance='true'] #initial-loading-overlay::after {
        width: 120px;
        height: 1px;
        border: 0;
        border-radius: 0;
        background: linear-gradient(90deg, transparent, #c9cfff80, transparent);
        animation: none;
      }

      #initial-loading-overlay[data-hidden='true'] {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="initial-loading-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
