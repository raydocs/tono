[package]
name = "tono-windows"
version = "0.0.72"
description = "Tono Windows app"
authors = ["Tono"]
license = "GPL-3.0-only"
repository = "https://github.com/raydocs/tono.git"
default-run = "Tono"
build = "build.rs"
edition = "2024"
rust-version = "1.95"

# The shipped binary is `Tono` (Tono.exe). The crate is tono-windows.
[[bin]]
name = "Tono"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
verge-dev = ["tono-logger/color", "tono-service-protocol/development-channel"]
dev-sidecar = ["verge-dev"]
tauri-dev = ["dep:tauri-plugin-devtools"]
# Real-machine App -> installed Service testing. This never relaxes the Service's
# Program Files allowlist or injected SHA-256 check; it only lets a non-installed
# test App nominate that already-installed, still-validated core binary.
windows-integration-test = []
tokio-trace = ["console-subscriber"]
clippy = ["tauri/test"]
tracing = []

[package.metadata.bundle]
identifier = "com.raydocs.tono"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Gzip for the test-programme audit-log upload. The alternative was uploading the
# log uncompressed and compressing in the Worker, which needs no crate here but
# costs roughly eighteen times the bytes on the customer's own tunnel — measured
# on real audit data — and leaves the two clients behaving differently.
flate2 = "1"
tono-draft = { workspace = true }
tono-logging = { workspace = true }
tono-signal = { workspace = true }
tono-i18n = { workspace = true }
tono-limiter = { workspace = true }
tauri-plugin-tono-sysinfo = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri = { workspace = true, features = [
  "tray-icon",
  "image-ico",
  "image-png",
] }
parking_lot = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
compact_str = { workspace = true }
flexi_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
smartstring = { workspace = true, features = ["serde"] }
bitflags = { workspace = true }
socket2 = { workspace = true }
warp = { version = "0.4.3", features = ["server"] }
open = "5.4.0"
dunce = "1.0.5"
nanoid = "0.5"
chrono = "0.4.45"
boa_engine = "0.21.1"
once_cell = { version = "1.21.4", features = ["parking_lot"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["json", "cookies", "gzip", "rustls", "form"] }
regex = "1.13.1"
sysproxy = { path = "../../vendor/sysproxy", features = [
  "guard",
] }
network-interface = { version = "2.0.5", features = ["serde"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2.10.1"
zip = "8.6.0"
reqwest_dav = "0.3.3"
aes-gcm = { version = "0.11.0" }
base64 = "0.23.0"
getrandom = "0.4.3"
futures = "0.3.33"
gethostname = "1.1.0"
scopeguard = "1.2.0"
tauri-plugin-notification = "2.3.3"
tokio-stream = "0.1.19"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
tauri-plugin-http = "2.5.9"
console-subscriber = { version = "0.5.0", optional = true }
# The devtools plugin enables Tauri's `tracing` feature. On Windows that makes
# WebView JavaScript dispatch synchronous, so it must not be feature-unified
# into production builds that never register the plugin.
tauri-plugin-devtools = { version = "2.1.0", optional = true }
tono-plugin-core = { path = "../../crates/tono-plugin-core" }
tono-logger = { path = "../../crates/tono-logger" }
async-trait = "0.1.91"
tono-service-protocol = { path = "../../service", version = "2.6.7", features = [
  "client",
] }
arc-swap = "1.9.2"
tokio-rustls = "0.26.4"
rustls = { version = "0.23.42", features = ["ring"] }
webpki-roots = "1.0.9"
rust_iso3166 = "0.2.0"
# Use the git repo until the next release after v2.0.0.
dark-light = { git = "https://github.com/rust-dark-light/dark-light" }
bytes = "1.12.1"
tokio-util = { version = "0.7.19", features = ["rt", "time"] }
tono-core = { path = "../../crates/tono-core" }
keyring = { version = "3", default-features = false, features = [
  "windows-native",
  "apple-native",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSString",
  "NSDictionary",
  "NSAttributedString",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSAttributedString",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSFont",
  "NSFontDescriptor",
  "NSColor",
  "NSParagraphStyle",
  "NSStringDrawing",
  "NSText",
] }

[target.'cfg(windows)'.dependencies]
tono-authenticode = { path = "../../crates/tono-authenticode" }
deelevate = { workspace = true }
runas = "=1.2.0"
winreg = "0.56.0"
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
warp = { version = "0.4.3", features = ["test"] }

[lints]
workspace = true
