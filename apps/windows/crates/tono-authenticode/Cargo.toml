[package]
name = "tono-authenticode"
description = "Shared Authenticode verification for the Tono Windows App and Service."
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
authors = ["Raydocs"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
] }
